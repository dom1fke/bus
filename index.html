<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1720">
<title>Bus Naurod</title>
<style>
  :root {
    --bg: #f3f5f7; --fg: #101820; --muted: #5b6875; --card: #ffffff;
    --line: #dde3e8; --accent: #0b6b4f; --accent-fg: #ffffff;
    --late: #b3261e; --ok: #0b6b4f; --soon: #b45309;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1720; --fg: #eef2f5; --muted: #93a1ae; --card: #17212c;
      --line: #263341; --accent: #3ec99a; --accent-fg: #07251b;
      --late: #ff8a80; --ok: #3ec99a; --soon: #ffb454; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); margin: 0; min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
  .tools { display: flex; gap: 8px; flex: none; }
  .iconbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--accent); padding: 0; }
  .iconbtn svg { display: block; }
  .iconbtn.on { background: var(--accent); color: var(--accent-fg); }
  .iconbtn[hidden] { display: none; }
  #whenClear { font-size: 18px; color: var(--muted); }
  #title.set { color: var(--accent); }
  /* Platzhalter, solange noch keine Abfahrten vorliegen */
  .dep.skel { pointer-events: none; }
  .skel .sk { background: var(--line); border-radius: 6px; animation: skel 1.2s ease-in-out infinite; }
  .skel .badge.sk { background: var(--line); color: transparent; }
  .skel .sk.l1 { height: 18px; width: 70%; margin-bottom: 7px; }
  .skel .sk.l2 { height: 12px; width: 35%; }
  .skel .sk.e1 { height: 26px; width: 74px; margin: 0 0 6px auto; }
  .skel .sk.e2 { height: 12px; width: 44px; margin-left: auto; }
  @keyframes skel { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .skel .sk { animation: none; } }
  .chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px;
    padding: 6px 6px 6px 14px; border: 1px solid var(--accent); border-radius: 12px; color: var(--accent); font-size: 15px; }
  .chip[hidden] { display: none; }
  .chip button { flex: none; width: 36px; height: 36px; border: 0; border-radius: 8px;
    background: transparent; color: inherit; font: inherit; font-size: 18px; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .5);
    display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
  .sheet[hidden] { display: none; }
  .panel { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px; margin-bottom: env(safe-area-inset-bottom, 0px); }
  .panel h2 { font-size: 17px; margin: 0; }
  .panel label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  .panel input { display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 46px;
    -webkit-appearance: none; appearance: none; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-align: left; }
  .panel input::-webkit-date-and-time-value { text-align: left; min-width: 0; }
  .panel input::-webkit-datetime-edit { padding: 0; }
  .panel .row { display: flex; gap: 8px; margin-top: 16px; }
  .panel .row button { flex: 1; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  .panel .row button.sec { background: transparent; color: var(--accent); }
  .panel .err { color: var(--late); font-size: 14px; margin-top: 8px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button.dir { display: block; width: 100%; font: inherit; font-size: 22px; font-weight: 700; padding: 16px 14px 14px; min-height: 112px;
    border-radius: 14px; border: 2px solid var(--accent); background: transparent;
    color: var(--accent); text-align: left; position: relative;
    transition: opacity .25s ease, background-color .25s ease, color .25s ease; }
  button.dir small { display: block; font-size: 13px; line-height: 1.3; font-weight: 500; color: var(--muted); margin-top: 4px; }
  button.dir[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  button.dir[aria-pressed="true"] small { color: inherit; opacity: .8; }
  .buttons.has-sel button.dir[aria-pressed="false"] { opacity: .5; }
  .dep.fade { animation: rise .35s ease-out both; animation-delay: calc(var(--i, 0) * 80ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* Nach einem Wischen gleiten die Einträge aus der Wischrichtung herein. */
  .dep.fade.slide { animation-name: slidein; animation-delay: calc(var(--i, 0) * 50ms); }
  @keyframes slidein { from { opacity: 0; transform: translateX(var(--dx, 40px)); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .dep.fade { animation: none; } button.dir { transition: none; } }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #out { margin-top: 10px; display: grid; gap: 0; }
  .dep { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 2px; }
  .dep:first-child { border-bottom-color: var(--accent); }
  .badge { min-width: 48px; text-align: center; font-weight: 700; padding: 6px 8px;
    border-radius: 8px; background: var(--accent); color: var(--accent-fg); }
  .dest { min-width: 0; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; font-size: 17px; line-height: 1.3; }
  .dest span { display: block; color: var(--muted); font-size: 14px; }
  .late, .dest span.late { color: var(--late); font-weight: 600; }
  .dep { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .dep[data-ref] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .dep:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .chev { display: inline-block; margin-left: 4px; transition: transform .2s ease; }
  .dep.open .chev { transform: rotate(180deg); }
  .trace { grid-column: 1 / -1; margin: 12px 0 4px 22px; border-left: 2px solid var(--line);
    padding-left: 18px; display: grid; gap: 12px; cursor: pointer; }
  .trace .note { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .stop { display: flex; justify-content: space-between; gap: 10px; position: relative; font-size: 15px; }
  .stop > span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .stop::before { content: ""; position: absolute; left: -26px; top: 6px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .stop.first::before, .stop.last::before { background: var(--accent); }
  .stop.last { font-weight: 600; }
  .stop .t { font-variant-numeric: tabular-nums; color: var(--muted); }
  .stop .t.l { color: var(--late); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  .eta { text-align: right; font-variant-numeric: tabular-nums; }
  .eta strong { font-size: 28px; display: block; line-height: 1.1; white-space: nowrap; }
  .eta strong .u { font-size: .6em; font-weight: 600; color: inherit; margin-left: .15em; }
  .eta span { font-size: 14px; color: var(--muted); }
  .eta.soon strong { color: var(--soon); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .eta.soon strong { animation: none; } }
  .msg { color: var(--muted); padding: 12px 2px; overflow-wrap: anywhere; }
  .msg.err { color: var(--late); }
  .foot { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex;
    justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  /* „Stand …“ zum Antippen: lädt sofort neu */
  .foot #stamp { text-decoration: none; -webkit-tap-highlight-color: transparent; }
  #stamp::after { content: "↻"; display: inline-block; margin-left: 6px; }
  #stamp:empty::after { content: none; }
  #stamp.busy::after { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #stamp.busy::after { animation: none; opacity: .5; } }
  .foot button { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted);
    text-decoration: underline; padding: 4px 0; }
  #setup { margin-top: 20px; display: none; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; }
  #setup.open { display: block; }
  #setup label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  #setup input { width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #setup .row { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  #setup .row button { font: inherit; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  #setup .row button.sec { background: transparent; color: var(--accent); }
  #setup h2 { font-size: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px; }
  #setup .group { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin-bottom: 10px; background: var(--bg); }
  #setup .ghead { display: flex; align-items: center; gap: 8px; padding: 8px 0 6px; }
  #setup input.gname { flex: 1; min-width: 0; font: inherit; font-size: 18px; font-weight: 700; color: var(--accent);
    background: transparent; border: 0; padding: 4px 0; border-radius: 6px; }
  #setup .gedit { flex: none; font-size: 13px; color: var(--muted); }
  #setup button.field { display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 0; text-align: left;
    font: inherit; color: var(--fg); background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
  #setup button.field:disabled { color: var(--muted); }
  #setup .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); flex: none; }
  #setup .dot.f { background: var(--accent); }
  #setup .lbl { width: 40px; flex: none; font-size: 13px; color: var(--muted); }
  #setup .val { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #setup .arrow { color: var(--muted); flex: none; }
  #setup .lines { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 0 12px;
    border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #setup .lines .lbl { margin-right: 2px; }
  #setup .lchip { font: inherit; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  #setup .lchip[aria-pressed="false"] { background: transparent; border-color: var(--line); color: var(--muted);
    font-weight: 500; text-decoration: line-through; }
  #setup .switch { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted);
    margin: 2px 0 12px 2px; cursor: pointer; }
  #setup .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #setup .tgl { width: 42px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none;
    transition: background-color .2s ease; }
  #setup .tgl::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform .2s ease; }
  #setup .switch input:checked + .tgl { background: var(--accent); }
  #setup .switch input:checked + .tgl::after { transform: translateX(16px); }
  #setup .switch input:focus-visible + .tgl { outline: 3px solid var(--accent); outline-offset: 2px; }
  #setup .wlabel { margin-top: 14px; }
  /* Haltestellensuche: eigene Seite über allem */
  .picker { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .picker[hidden] { display: none; }
  .pkin { max-width: 480px; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .pkback { font: inherit; font-size: 16px; color: var(--accent); background: none; border: 0; padding: 6px 0; }
  .picker h2 { font-size: 22px; margin: 4px 0 12px; }
  #pkInput { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--accent);
    background: var(--card); color: var(--fg); -webkit-appearance: none; appearance: none; }
  #pkInput:focus-visible { outline: none; }
  .pkopt { display: block; width: 100%; text-align: left; font: inherit; color: var(--fg); background: none; border: 0;
    border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 4px; overflow-wrap: anywhere; }
  .pkopt b { color: var(--accent); font-weight: 700; }
  .pknote { color: var(--muted); font-size: 14px; padding: 14px 4px; }
  .pkhead { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 2px 2px; }
  .pkhead[hidden] { display: none; }
  .side { display: contents; }
  /* Handy quer: zwei Spalten. Gilt nur im Querformat, das Hochformat bleibt unverändert. */
  /* Gilt für Handys quer und für breite Fenster am Computer. */
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse),
         (orientation: landscape) and (min-width: 800px) {
    main { max-width: 1000px; display: grid; grid-template-columns: minmax(220px, 32%) 1fr; column-gap: 24px;
      grid-template-rows: auto auto 1fr;
      grid-template-areas: "side out" "side foot" "side setup"; align-items: start; }
    .side { display: block; grid-area: side; position: sticky; top: max(10px, env(safe-area-inset-top)); }
    .top { margin-bottom: 10px; }
    .buttons { grid-template-columns: 1fr; gap: 8px; }
    button.dir { min-height: 0; height: auto; font-size: 19px; padding: 10px 12px 12px; }
    #out { grid-area: out; margin-top: 0; }
    .foot { grid-area: foot; }
    #setup { grid-area: setup; }
    .dep { padding: 8px 2px; }
    .dest span { display: inline; margin-left: 8px; }
    .eta { display: flex; align-items: baseline; gap: 10px; }
    .eta strong { font-size: 24px; }
    .sheet { align-items: center; }
  }
</style>
</head>
<body>
<main>
  <div class="side">
  <div class="top">
    <h1 id="title">Abfahrten jetzt</h1>
    <div class="tools">
    <button id="whenClear" class="iconbtn" type="button" aria-label="Zurück zu Jetzt" hidden>✕</button>
    <button id="when" class="iconbtn" type="button" aria-label="Tag und Uhrzeit wählen">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    </button>
    </div>
  </div>

  <div class="buttons">
    <button class="dir" id="btnIn" aria-pressed="false">In die Stadt
      <small>Fondetter Straße → Dernsches Gelände</small></button>
    <button class="dir" id="btnOut" aria-pressed="false">Aus der Stadt
      <small>Wilhelmstraße → Fondetter Straße</small></button>
  </div>

  </div>

  <div id="out" aria-live="polite"></div>

  <div class="foot">
    <button id="stamp" type="button" aria-label="Jetzt aktualisieren"></button>
    <button id="openSetup">Einstellungen</button>
  </div>

  <section id="setup">
    <h2>Einstellungen</h2>
    <div class="group" data-dir="in"></div>
    <label class="switch"><input type="checkbox" id="mirror"><span class="tgl" aria-hidden="true"></span>Rückweg = Hinweg umgekehrt</label>
    <div class="group" data-dir="out"></div>
    <label for="worker" class="wlabel">Worker-Adresse (https://….workers.dev)</label>
    <input id="worker" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <button id="saveKey">Speichern</button>    </div>
  </section>
</main>

<div id="picker" class="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pkTitle">
  <div class="pkin">
    <button id="pkBack" class="pkback" type="button">‹ Einstellungen</button>
    <h2 id="pkTitle">Starthaltestelle</h2>
    <input id="pkInput" type="text" placeholder="Haltestelle suchen" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Haltestelle suchen">
    <div id="pkList" aria-live="polite"></div>
    <div id="pkRecentHead" class="pkhead">Zuletzt gewählt</div>
    <div id="pkRecent"></div>
  </div>
</div>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <h2 id="sheetTitle">Abfahrtszeit wählen</h2>
    <label for="wDate">Tag</label>
    <input id="wDate" type="date">
    <label for="wTime">Uhrzeit</label>
    <input id="wTime" type="time">
    <div class="err" id="wErr" aria-live="polite"></div>
    <div class="row">
      <button id="wNow" class="sec" type="button">Zurück zu Jetzt</button>
      <button id="wApply" type="button">Übernehmen</button>
    </div>
  </div>
</div>

<script>
"use strict";
// ---- Konfiguration -------------------------------------------------------
// Adresse deines Cloudflare Workers; wird in den Einstellungen gespeichert.
// Haltestellen je Richtung; in den Einstellungen änderbar. Ohne gespeicherte
// Kennung (id) wird die Haltestelle beim ersten Abruf per Name gesucht.
const NAUROD = { id: "3025442", name: "WI-Naurod Fondetter Straße", label: "Fondetter Straße" };
const DEFAULT_CFG = {
  mirror: false,
  in:  { name: "In die Stadt",  off: [], from: NAUROD,
         to: { query: "Wiesbaden Dernsches Gelände", must: "dern", label: "Dernsches Gelände" } },
  out: { name: "Aus der Stadt", off: [], to: NAUROD,
         from: { query: "Wiesbaden Wilhelmstraße", must: "wilhelmstra", label: "Wilhelmstraße" } }
};

// ---- Speicher (kann in privaten Fenstern fehlen) --------------------------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const $ = (id) => document.getElementById(id);
let current = store.get("dir") || null;
let timer = null;
let when = null;   // gewählte Abfahrtszeit (nur im Speicher), null = jetzt
let hiddenAt = 0;
let routeIds = null;      // Haltestellen der aktuellen Richtung (für den Fahrtverlauf)
let openRow = null;       // gerade aufgeklappter Eintrag
const traceCache = new Map();
let slideFrom = 0;        // Richtung der Einblendung nach einem Wischen (px), 0 = normal
let animateNext = true;   // Einträge nur beim Öffnen und beim Wechsel einblenden, nicht bei jeder Aktualisierung
let lastDeps = null;      // letzte Abfahrten, um nach dem Drehen neu einzupassen

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function loadCfg() {
  let c = null;
  try { c = JSON.parse(store.get("cfg") || "null"); } catch (e) { c = null; }
  if (!c || !c.in || !c.out) {
    c = clone(DEFAULT_CFG);
    // Bereits früher gefundene Haltestellen übernehmen.
    const z = store.get("stop_ziel"), s = store.get("stop_stadt");
    if (z) { c.in.to.id = z; c.in.to.name = store.get("stopname_ziel") || c.in.to.label; }
    if (s) { c.out.from.id = s; c.out.from.name = store.get("stopname_stadt") || c.out.from.label; }
  }
  return c;
}
let cfg = loadCfg();
function saveCfg() { store.set("cfg", JSON.stringify(cfg)); }

// Start, Ziel, Name und abgewählte Linien einer Richtung.
function routeOf(c, dir) {
  const r = c[dir];
  if (dir === "out" && c.mirror) return { name: r.name, off: r.off || [], from: c.in.to, to: c.in.from };
  return { name: r.name, off: r.off || [], from: r.from, to: r.to };
}
function shortName(n) {
  return (n || "").replace(/^(Wiesbaden|WI)[\s-]+/i, "").trim();
}
function stopLabel(s) { return (s && (s.label || shortName(s.name))) || "–"; }
function seenKey(fromId, toId) { return "seen_" + fromId + "_" + toId; }
function seenLines(fromId, toId) {
  try { return JSON.parse(store.get(seenKey(fromId, toId)) || "[]"); } catch (e) { return []; }
}
const byLine = (a, b) => a.localeCompare(b, "de", { numeric: true });

// Ort einer Haltestelle, z. B. „WI-Naurod Fondetter Straße“ → „Naurod“,
// „Wiesbaden Dernsches Gelände“ → „Wiesbaden“.
function placeOf(s) {
  const n = ((s && (s.name || s.query)) || "").replace(/^WI-/i, "").trim();
  return n.split(/\s+/)[0] || "";
}
function applyTitle() {
  const r = routeOf(cfg, "in");
  let a = placeOf(r.from), b = placeOf(r.to);
  // Liegen beide Haltestellen im selben Ort, die Haltestellen selbst nennen.
  if (!a || !b || a === b) { a = stopLabel(r.from); b = stopLabel(r.to); }
  document.title = "Bus " + a + " ⇄ " + b;
}
function applyTiles() {
  applyTitle();
  [["in", "btnIn"], ["out", "btnOut"]].forEach(([dir, id]) => {
    const r = routeOf(cfg, dir);
    const b = $(id);
    b.textContent = r.name || (dir === "in" ? "In die Stadt" : "Aus der Stadt");
    const s = document.createElement("small");
    s.textContent = stopLabel(r.from) + " → " + stopLabel(r.to);
    b.appendChild(s);
  });
}

// ---- Hilfsfunktionen -----------------------------------------------------
function norm(s) {
  return (s || "").toLowerCase().replace(/ß/g, "ss").replace(/straße/g, "strasse");
}

async function hapi(path, params) {
  let base = (store.get("worker") || "").trim().replace(/\/+$/, "");
  if (!base) throw new Error("Noch keine Worker-Adresse gespeichert. Unter „Einstellungen“ eintragen.");
  const qs = new URLSearchParams(params);
  let res;
  try {
    // Der RMV-Schlüssel liegt als Secret im Worker, nicht in der App.
    res = await fetch(base + "/" + path + "?" + qs.toString());
  } catch (e) {
    throw new Error("Keine Verbindung zum Worker. Adresse und Internet prüfen.");
  }
  if (!res.ok) throw new Error("Worker/RMV antwortet mit Fehler " + res.status + ".");
  const data = await res.json();
  if (data.errorCode) throw new Error("RMV: " + (data.errorText || data.errorCode));
  return data;
}

async function searchStops(text) {
  const data = await hapi("location.name", { input: text, type: "S", maxNo: 12 });
  return (data.stopLocationOrCoordLocation || [])
    .map((x) => x.StopLocation).filter(Boolean)
    .map((s) => ({ id: String(s.extId || s.id), name: s.name }));
}

// Liefert die Kennung einer Haltestelle; fehlt sie, wird einmalig per Name gesucht.
async function stopId(stop) {
  if (stop.id) return stop.id;
  const list = await searchStops(stop.query);
  const hit = list.find((s) => norm(s.name).includes(stop.must || "")) || list[0];
  if (!hit) throw new Error("Haltestelle „" + stop.query + "“ nicht gefunden.");
  stop.id = hit.id;
  stop.name = hit.name;
  saveCfg();
  return stop.id;
}

function parseTime(date, time) {
  if (!date || !time) return null;
  return new Date(date + "T" + time);
}

function lineOf(d) {
  const p = d.ProductAtStop || {};
  return (p.line || (d.name || "").replace(/^Bus\s*/i, "")).trim();
}

// ---- Fahrtverlauf ----------------------------------------------------------
function journeyId(ref) {
  if (!ref) return null;
  if (/^https?:/i.test(ref)) {
    try { return new URL(ref).searchParams.get("id"); } catch (e) { return null; }
  }
  return ref;
}

async function fetchStops(ref) {
  const id = journeyId(ref);
  if (!id) throw new Error("Für diese Fahrt gibt es keinen Verlauf.");
  const hit = traceCache.get(id);
  if (hit && Date.now() - hit.at < 60000) return hit.stops;
  const data = await hapi("journeyDetail", { id });
  let stops = (data.Stops && data.Stops.Stop) || [];
  if (!Array.isArray(stops)) stops = [stops];
  traceCache.set(id, { at: Date.now(), stops });
  return stops;
}

function stopTimes(s) {
  const planned = parseTime(s.arrDate || s.depDate, s.arrTime || s.depTime);
  const real = parseTime(s.rtArrDate || s.rtDepDate || s.arrDate || s.depDate,
                         s.rtArrTime || s.rtDepTime) || planned;
  return { planned, real };
}

// Von der Einstiegs- bis zur Zielhaltestelle.
function sliceStops(stops) {
  let a = 0, b = stops.length - 1;
  if (routeIds) {
    const i = stops.findIndex((s) => String(s.extId || "") === String(routeIds.fromId));
    if (i >= 0) a = i;
    let j = stops.findIndex((s, k) => k > a && String(s.extId || "") === String(routeIds.toId));
    if (j < 0 && routeIds.toName) {
      const key = norm(routeIds.toName);
      j = stops.findIndex((s, k) => k > a && norm(s.name) === key);
    }
    if (j >= 0) b = j;
  }
  return stops.slice(a, b + 1);
}

function fillTrace(box, stops) {
  box.textContent = "";
  const list = sliceStops(stops);
  if (!list.length) { box.textContent = "Kein Verlauf verfügbar."; box.className = "trace note"; return; }
  list.forEach((s, i) => {
    const { planned, real } = stopTimes(s);
    const row = document.createElement("div");
    row.className = "stop" + (i === 0 ? " first" : "") + (i === list.length - 1 ? " last" : "");
    const n = document.createElement("span");
    n.textContent = (s.name || "").replace(/^WI-/, "");
    const t = document.createElement("span");
    t.className = "t";
    if (real) {
      t.textContent = fmt(real);
      if (planned && real - planned >= 60000) t.classList.add("l");
    }
    row.append(n, t);
    box.appendChild(row);
  });
}

function closeRow(el) {
  const box = el.querySelector(".trace");
  if (box) box.remove();
  el.classList.remove("open");
  el.setAttribute("aria-expanded", "false");
  if (openRow === el) openRow = null;
}

function smoothTop(after) {
  if (window.scrollY <= 1) { after(); return; }
  window.scrollTo({ top: 0, behavior: "smooth" });
  const t0 = Date.now();
  (function wait() {
    if (window.scrollY <= 1 || Date.now() - t0 > 900) after();
    else requestAnimationFrame(wait);
  })();
}
function keepVisible(el) {
  // Nach dem Aufklappen so scrollen, dass der ganze Eintrag samt Verlauf sichtbar ist.
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect();
    const vh = window.innerHeight;
    const m = 16;
    let dy = 0;
    if (r.height + 2 * m >= vh || r.top < m) dy = r.top - m;
    else if (r.bottom > vh - m) dy = r.bottom - (vh - m);
    if (dy) window.scrollBy({ top: dy, behavior: "smooth" });
  });
}
function toggleRow(el) {
  if (el.classList.contains("open")) {
    // Erst sanft ganz nach oben scrollen, dann zuklappen, damit die Seite nicht springt.
    smoothTop(() => closeRow(el));
    return;
  }
  if (openRow) closeRow(openRow);
  const box = document.createElement("div");
  box.className = "trace";
  const note = document.createElement("div");
  note.className = "note";
  note.textContent = "Lade Verlauf …";
  box.appendChild(note);
  el.appendChild(box);
  el.classList.add("open");
  el.setAttribute("aria-expanded", "true");
  openRow = el;
  fetchStops(el.dataset.ref).then((stops) => {
    if (!box.isConnected) return;
    fillTrace(box, stops);
    keepVisible(el);
  }).catch((e) => {
    if (!box.isConnected) return;
    note.textContent = "Verlauf nicht verfügbar. " + (e.message || "");
    keepVisible(el);
  });
}

function fmt(d) {
  return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

const p2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const hm = (d) => p2(d.getHours()) + ":" + p2(d.getMinutes());
function dayLabel(d) {
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}

// ---- Abfrage -------------------------------------------------------------
// Beide Richtungen werden vorgehalten, damit der Wechsel ohne Wartezeit klappt.
let cache = {};             // dir -> { key, deps, ids, at }
const pending = {};         // dir -> laufende Abfrage
let animUntil = 0;          // bis wann die Einblendung läuft

function cacheKey(dir) {
  const r = routeOf(cfg, dir);
  return (r.from.id || r.from.query) + "|" + (r.to.id || r.to.query) + "|" + (when ? when.getTime() : "jetzt");
}

function fetchDir(dir) {
  const key = cacheKey(dir);
  if (pending[dir] && pending[dir].key === key) return pending[dir].p;
  const p = (async () => {
    const route = routeOf(cfg, dir);
    const fromId = await stopId(route.from);
    const toId = await stopId(route.to);
    // Ohne Linienfilter: alle Linien, die von der Start- zur Zielhaltestelle fahren.
    const params = { id: fromId, direction: toId, maxJourneys: 20, duration: 720 };
    if (when) { params.date = ymd(when); params.time = hm(when); }
    const data = await hapi("departureBoard", params);
    let deps = data.Departure || [];
    if (!Array.isArray(deps)) deps = [deps];
    // Gefundene Linien merken, damit man sie in den Einstellungen abwählen kann.
    const seen = new Set(seenLines(fromId, toId));
    deps.forEach((d) => { const l = lineOf(d); if (l) seen.add(l); });
    store.set(seenKey(fromId, toId), JSON.stringify([...seen].sort(byLine)));
    const entry = { key: cacheKey(dir), deps, ids: { fromId, toId, toName: route.to.name }, at: Date.now() };
    // Schlüssel erst nach dem Auflösen der Haltestellen vergleichen (Name → Kennung).
    if (entry.key === cacheKey(dir)) cache[dir] = entry;
    return entry;
  })();
  pending[dir] = { key, p };
  p.finally(() => { if (pending[dir] && pending[dir].p === p) delete pending[dir]; }).catch(() => {});
  return p;
}

function fresh(dir, maxAge) {
  const c = cache[dir];
  return c && c.key === cacheKey(dir) && Date.now() - c.at < maxAge ? c : null;
}

function show(entry) {
  routeIds = entry.ids;
  const off = routeOf(cfg, current).off;
  lastDeps = entry.deps.filter((d) => !off.includes(lineOf(d)));
  render(lastDeps);
}

function showSkeleton() {
  const out = $("out");
  out.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const el = document.createElement("div");
    el.className = "dep skel";
    el.innerHTML = '<div class="badge sk">00</div><div><div class="sk l1"></div><div class="sk l2"></div></div>' +
                   '<div><div class="sk e1"></div><div class="sk e2"></div></div>';
    out.appendChild(el);
  }
}

function showError(e) {
  const out = $("out");
  // Stehen schon Abfahrten da, bleiben sie; nur der Stand zeigt das Problem.
  if (out.querySelector(".dep:not(.skel)")) {
    $("stamp").textContent = "Aktualisierung fehlgeschlagen";
    return;
  }
  out.innerHTML = "";
  const m = document.createElement("div");
  m.className = "msg err";
  m.textContent = e.message || String(e);
  out.appendChild(m);
}

// Aktuelle Richtung neu laden. Ohne Einblendung wird nur ersetzt, wenn sich etwas geändert hat.
async function load() {
  if (!current) { $("out").innerHTML = ""; return; }
  const dir = current, key = cacheKey(dir);
  const before = cache[dir] && cache[dir].key === key ? JSON.stringify(cache[dir].deps) : null;
  try {
    const entry = await fetchDir(dir);
    if (dir !== current || entry.key !== cacheKey(dir) || openRow) return;
    const changed = JSON.stringify(entry.deps) !== before;
    const wait = Math.max(0, animUntil - Date.now());
    if (animateNext || changed || !$("out").querySelector(".dep:not(.skel)")) {
      setTimeout(() => { if (dir === current && !openRow) show(entry); }, animateNext ? 0 : wait);
    } else {
      $("stamp").textContent = "Stand " + fmt(new Date());
    }
  } catch (e) {
    if (dir === current) showError(e);
  }
}

// Die andere Richtung still im Hintergrund vorhalten.
function prefetchOther() {
  if (!current) return;
  const other = current === "in" ? "out" : "in";
  if (!fresh(other, 25000)) fetchDir(other).catch(() => {});
}

function render(deps) {
  const out = $("out");
  out.innerHTML = "";
  const anim = animateNext;
  animateNext = false;
  if (anim) animUntil = Date.now() + 900;
  const slideDx = anim ? slideFrom : 0;
  slideFrom = 0;
  openRow = null;
  const now = new Date();
  const ref = when || now;
  const rows = deps.map((d) => {
    const plan = parseTime(d.date, d.time);
    const real = parseTime(d.rtDate || d.date, d.rtTime) || plan;
    return { d, plan, real, cancelled: d.cancelled === true || d.cancelled === "true" };
  }).filter((r) => r.real && r.real >= new Date(ref.getTime() - 30000))
    .sort((a, b) => a.real - b.real)
    .slice(0, 8);

  if (!rows.length) {
    const m = document.createElement("div");
    m.className = "msg";
    const r = routeOf(cfg, current);
    const way = " von " + stopLabel(r.from) + " nach " + stopLabel(r.to);
    m.textContent = when
      ? "Keine Abfahrten" + way + " in den 12 Stunden ab " + fmt(when) + "."
      : "Keine Abfahrten" + way + " in den nächsten 12 Stunden.";
    out.appendChild(m);
  }

  rows.forEach((r, i) => {
    const mins = Math.max(0, Math.round((r.real - now) / 60000));
    const delay = Math.round((r.real - r.plan) / 60000);
    const el = document.createElement("div");
    el.className = "dep";
    if (anim) {
      el.classList.add("fade"); el.style.setProperty("--i", i);
      if (slideDx) { el.classList.add("slide"); el.style.setProperty("--dx", slideDx + "px"); }
    }
    const ref = r.d.JourneyDetailRef && r.d.JourneyDetailRef.ref;
    if (ref) {
      el.dataset.ref = ref;
      el.setAttribute("role", "button");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-expanded", "false");
    }

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = lineOf(r.d);

    const dest = document.createElement("div");
    dest.className = "dest";
    dest.textContent = r.d.direction || "";
    const sub = document.createElement("span");
    if (r.cancelled) { sub.textContent = "Fällt aus"; sub.className = "late"; }
    else if (delay > 0) { sub.textContent = "+" + delay + " min · Plan " + fmt(r.plan); sub.className = "late"; }
    else { sub.textContent = r.d.rtTime ? "pünktlich" : "laut Fahrplan"; }
    dest.appendChild(sub);

    const eta = document.createElement("div");
    eta.className = "eta";
    const big = document.createElement("strong");
    if (when) {
      big.textContent = fmt(r.real);
    } else {
      // Ab einer Stunde in Stunden und Minuten, das liest sich leichter als „340 min“.
      // Zahlen groß, Einheiten (Std, min) kleiner.
      const hh = Math.floor(mins / 60), mm = mins % 60;
      const part = (n, u) => {
        const s = document.createElement("span"); s.className = "u"; s.textContent = u;
        big.append(String(n), s);
      };
      if (mins === 0) big.textContent = "jetzt";
      else if (mins < 60) part(mins, "min");
      else { part(hh, "Std"); if (mm) { big.append(" "); part(mm, "min"); } }
      if (!r.cancelled && mins <= 5) eta.classList.add("soon");
    }
    const t = document.createElement("span");
    t.textContent = (when ? dayLabel(r.real) : fmt(r.real)) + " ";
    if (ref) {
      const chev = document.createElement("span");
      chev.className = "chev";
      chev.setAttribute("aria-hidden", "true");
      chev.textContent = "⌄";
      t.appendChild(chev);
    }
    eta.append(big, t);

    el.append(badge, dest, eta);
    out.appendChild(el);
  });

  $("stamp").textContent = "Stand " + fmt(new Date());

  // So viele Einträge zeigen, wie ohne Scrollen passen (mindestens 3, höchstens 8).
  let padB = parseFloat(getComputedStyle(document.querySelector("main")).paddingBottom) || 0;
  // Der Home-Balken ist dünn, ein kleiner Abstand reicht, damit möglichst viel Platz genutzt wird.
  padB = Math.min(padB, 10);
  const foot = document.querySelector(".foot");
  // Gemessen ab Seitenanfang, damit es auch nach dem Scrollen stimmt.
  while (out.children.length > 3 && foot.getBoundingClientRect().bottom + window.scrollY + padB > window.innerHeight) {
    out.removeChild(out.lastElementChild);
  }
}

// ---- Bedienung -----------------------------------------------------------
function select(dir) {
  current = dir;
  animateNext = true;
  store.set("dir", dir);
  document.querySelector(".buttons").classList.add("has-sel");
  $("btnIn").setAttribute("aria-pressed", String(dir === "in"));
  $("btnOut").setAttribute("aria-pressed", String(dir === "out"));
  const c = fresh(dir, 5 * 60000);
  if (c) {
    show(c);                                 // sofort aus dem Vorrat, ohne Ladehinweis
    if (Date.now() - c.at > 20000) load();   // und still auffrischen
  } else {
    showSkeleton();
    load();
  }
  prefetchOther();
  clearInterval(timer);
  // Solange ein Verlauf aufgeklappt ist, bleibt die Liste stehen.
  timer = setInterval(() => { if (!when && !openRow) { load(); prefetchOther(); } }, 30000);
}

// Wischen nach links: „Aus der Stadt“, nach rechts: „In die Stadt“.
// Bewegungen, die am Bildschirmrand starten, bleiben dem Browser (Zurück/Vor) überlassen.
let swipe = null;
document.addEventListener("touchstart", (e) => {
  swipe = null;
  if (e.touches.length !== 1 || !$("sheet").hidden || !$("picker").hidden) return;
  if (e.target.closest("input, #setup")) return;
  const t = e.touches[0];
  if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
  swipe = { x: t.clientX, y: t.clientY, at: Date.now() };
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!swipe) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  const quick = Date.now() - swipe.at < 800;
  swipe = null;
  if (!quick || Math.abs(dx) < 60 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
  const dir = dx < 0 ? "out" : "in";
  if (dir === current) return;
  slideFrom = dx < 0 ? 40 : -40;
  select(dir);
}, { passive: true });
document.addEventListener("touchcancel", () => { swipe = null; }, { passive: true });

// Antippen von „Stand …“ aktualisiert sofort.
$("stamp").addEventListener("click", async () => {
  if (!current || $("stamp").classList.contains("busy")) return;
  if (openRow) closeRow(openRow);
  $("stamp").classList.add("busy");
  const t0 = Date.now();
  await load();
  prefetchOther();
  // Das Symbol kurz sichtbar drehen lassen, auch wenn die Antwort sehr schnell kommt.
  setTimeout(() => $("stamp").classList.remove("busy"), Math.max(0, 600 - (Date.now() - t0)));
});

$("btnIn").addEventListener("click", () => select("in"));
$("btnOut").addEventListener("click", () => select("out"));
// Einstellungen: beim Öffnen sanft nach unten scrollen, beim Schließen erst sanft
// nach oben und dann ausblenden, damit die Seite nicht springt.
function openSetup() {
  draft = clone(cfg);
  buildSetup();
  $("setup").classList.add("open");
  requestAnimationFrame(() => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" }));
}
function closeSetup(after) {
  smoothTop(() => { $("setup").classList.remove("open"); if (after) after(); });
}
$("openSetup").addEventListener("click", () => {
  if ($("setup").classList.contains("open")) closeSetup(); else openSetup();
});

function updateWhenUI() {
  $("when").classList.toggle("on", !!when);
  $("whenClear").hidden = !when;
  $("title").classList.toggle("set", !!when);
  $("title").textContent = when ? "Abfahrten ab " + dayLabel(when) + ", " + fmt(when) : "Abfahrten jetzt";
}
function setWhen(d) {
  when = d;
  updateWhenUI();
  if (current) select(current);
}
function openSheet() {
  const base = when || new Date();
  $("wDate").min = ymd(new Date());
  $("wDate").value = ymd(base);
  $("wTime").value = hm(base);
  $("wErr").textContent = "";
  $("sheet").hidden = false;
}
function closeSheet() { $("sheet").hidden = true; }

$("when").addEventListener("click", openSheet);
$("out").addEventListener("click", (e) => {
  // Ein Tipp irgendwo im Eintrag, auch auf den Verlauf selbst, klappt auf oder zu.
  const row = e.target.closest(".dep[data-ref]");
  if (row) toggleRow(row);
});
$("out").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest && e.target.closest(".dep[data-ref]");
  if (row && e.target === row) { e.preventDefault(); toggleRow(row); }
});
$("wApply").addEventListener("click", () => {
  const d = $("wDate").value, t = $("wTime").value;
  if (!d || !t) { $("wErr").textContent = "Bitte Tag und Uhrzeit wählen."; return; }
  const sel = new Date(d + "T" + t);
  if (isNaN(sel.getTime())) { $("wErr").textContent = "Diese Zeit ist ungültig."; return; }
  if (sel.getTime() < Date.now() - 5 * 60000) {
    $("wErr").textContent = "Die gewählte Zeit liegt in der Vergangenheit."; return;
  }
  closeSheet();
  setWhen(sel.getTime() - Date.now() < 120000 ? null : sel);
});
$("wNow").addEventListener("click", () => { closeSheet(); setWhen(null); });
$("whenClear").addEventListener("click", () => setWhen(null));
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("saveKey").addEventListener("click", () => {
  const w = $("worker").value.trim();
  if (!w) { $("worker").focus(); return; }
  store.set("worker", w);
  if (draft) {
    document.querySelectorAll("#setup input.gname").forEach((inp) => {
      draft[inp.dataset.dir].name = inp.value.trim() || DEFAULT_CFG[inp.dataset.dir].name;
    });
    cfg = draft; draft = null;
    saveCfg(); applyTiles();
    cache = {};
  }
  closeSetup(() => { if (current) select(current); });
});

// ---- Einstellungen: Haltestellen und Linien ---------------------------------
let draft = null;
function buildSetup() {
  $("mirror").checked = !!draft.mirror;
  document.querySelectorAll("#setup .group").forEach((g) => {
    const dir = g.dataset.dir;
    const r = routeOf(draft, dir);
    const locked = dir === "out" && draft.mirror;
    g.textContent = "";
    const head = document.createElement("div");
    head.className = "ghead";
    const name = document.createElement("input");
    name.className = "gname"; name.dataset.dir = dir; name.maxLength = 24;
    name.value = draft[dir].name; name.setAttribute("aria-label", "Name der Kachel");
    name.addEventListener("input", () => { draft[dir].name = name.value; });
    const ed = document.createElement("span");
    ed.className = "gedit"; ed.textContent = "Name ändern";
    ed.addEventListener("click", () => name.focus());
    head.append(name, ed);
    g.appendChild(head);
    [["from", "Von", true], ["to", "Nach", false]].forEach(([end, lbl, first]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "field"; b.disabled = locked;
      b.innerHTML = '<span class="dot' + (first ? " f" : "") + '"></span><span class="lbl"></span><span class="val"></span>' +
        (locked ? "" : '<span class="arrow">›</span>');
      b.querySelector(".lbl").textContent = lbl;
      b.querySelector(".val").textContent = stopLabel(r[end]);
      b.addEventListener("click", () => openPicker(dir, end));
      g.appendChild(b);
    });
    const lines = document.createElement("div");
    lines.className = "lines";
    const l = document.createElement("span");
    l.className = "lbl"; l.textContent = "Linien";
    lines.appendChild(l);
    const seen = r.from.id && r.to.id ? seenLines(r.from.id, r.to.id) : [];
    const off = draft[dir].off || (draft[dir].off = []);
    const all = [...new Set([...seen, ...off])].sort(byLine);
    if (!all.length) {
      const n = document.createElement("span");
      n.textContent = "alle – erscheinen nach der ersten Abfrage";
      lines.appendChild(n);
    }
    all.forEach((ln) => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "lchip"; c.textContent = ln;
      c.setAttribute("aria-pressed", String(!off.includes(ln)));
      c.setAttribute("aria-label", "Linie " + ln + " anzeigen");
      c.addEventListener("click", () => {
        const i = off.indexOf(ln);
        if (i >= 0) off.splice(i, 1); else off.push(ln);
        c.setAttribute("aria-pressed", String(i >= 0));
      });
      lines.appendChild(c);
    });
    g.appendChild(lines);
  });
}
$("mirror").addEventListener("change", () => {
  if (!draft) return;
  // Namen aus den Feldern nicht verlieren.
  document.querySelectorAll("#setup input.gname").forEach((inp) => { draft[inp.dataset.dir].name = inp.value; });
  draft.mirror = $("mirror").checked;
  draft.out.off = [];
  buildSetup();
});

// ---- Haltestellensuche (eigene Seite) --------------------------------------
let pick = null, pickTimer = null, pickSeq = 0, pickScroll = 0;
function recentStops() {
  try { return JSON.parse(store.get("recent_stops") || "[]"); } catch (e) { return []; }
}
function rememberStop(s) {
  const list = recentStops().filter((x) => x.id !== s.id);
  list.unshift({ id: s.id, name: s.name });
  store.set("recent_stops", JSON.stringify(list.slice(0, 5)));
}
function stopButton(s, query) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pkopt";
  const n = s.name || "";
  const i = query ? norm(n).indexOf(norm(query)) : -1;
  if (i >= 0) {
    // norm() ändert nur ß → ss, daher Länge über den Originaltext suchen.
    let len = query.length;
    while (len < n.length && norm(n.slice(i, i + len)).length < norm(query).length) len++;
    b.append(n.slice(0, i));
    const m = document.createElement("b"); m.textContent = n.slice(i, i + len);
    b.append(m, n.slice(i + len));
  } else {
    b.textContent = n;
  }
  b.addEventListener("click", () => choose(s));
  return b;
}
function showRecent() {
  const list = recentStops();
  $("pkRecent").textContent = "";
  list.forEach((s) => $("pkRecent").appendChild(stopButton(s, "")));
  $("pkRecentHead").hidden = !list.length;
}
function openPicker(dir, end) {
  pick = { dir, end };
  pickScroll = window.scrollY;
  $("pkTitle").textContent = end === "from" ? "Starthaltestelle" : "Zielhaltestelle";
  $("pkInput").value = "";
  $("pkList").textContent = "";
  showRecent();
  $("picker").hidden = false;
  $("picker").scrollTop = 0;
  $("pkInput").focus();
}
function closePicker() {
  $("picker").hidden = true;
  pick = null;
  clearTimeout(pickTimer);
  window.scrollTo(0, pickScroll);
}
function choose(s) {
  if (!pick || !draft) return;
  const { dir, end } = pick;
  draft[dir][end] = { id: s.id, name: s.name, label: shortName(s.name) };
  draft[dir].off = [];                       // andere Strecke, andere Linien
  if (dir === "in" && draft.mirror) draft.out.off = [];
  rememberStop(s);
  document.querySelectorAll("#setup input.gname").forEach((inp) => { draft[inp.dataset.dir].name = inp.value; });
  closePicker();
  buildSetup();
}
$("pkBack").addEventListener("click", closePicker);
$("pkInput").addEventListener("input", () => {
  clearTimeout(pickTimer);
  const q = $("pkInput").value.trim();
  const box = $("pkList");
  if (q.length < 2) { box.textContent = ""; showRecent(); return; }
  $("pkRecentHead").hidden = true; $("pkRecent").textContent = "";
  pickTimer = setTimeout(async () => {
    const seq = ++pickSeq;
    try {
      const list = await searchStops(q);
      if (seq !== pickSeq) return;          // inzwischen weitergetippt
      box.textContent = "";
      if (!list.length) {
        const n = document.createElement("div"); n.className = "pknote"; n.textContent = "Keine Haltestelle gefunden.";
        box.appendChild(n); return;
      }
      list.forEach((s) => box.appendChild(stopButton(s, q)));
    } catch (e) {
      if (seq !== pickSeq) return;
      box.textContent = "";
      const n = document.createElement("div"); n.className = "pknote"; n.textContent = e.message || String(e);
      box.appendChild(n);
    }
  }, 250);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("picker").hidden) closePicker(); });

// Nach dem Drehen oder einer Größenänderung neu einpassen.
// Kleine Höhenänderungen (Browserleiste ein-/ausgeblendet) lösen nichts aus.
let fitTimer = null, fitW = window.innerWidth, fitH = window.innerHeight;
function refit(force) {
  const w = window.innerWidth, hh = window.innerHeight;
  if (!force && w === fitW && Math.abs(hh - fitH) < 120) return;
  fitW = w; fitH = hh;
  // iOS passt die Kacheln nach dem Drehen nicht immer an: neu aufbauen erzwingt das Layout.
  const btns = document.querySelector(".buttons");
  btns.style.display = "none";
  void btns.offsetHeight;
  btns.style.display = "";
  applyTiles();
  if (lastDeps && current && !openRow && $("picker").hidden) render(lastDeps);
}
window.addEventListener("resize", () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => refit(false), 200);
});
// Manche iPhones melden die neue Größe erst kurz nach dem Drehen.
window.addEventListener("orientationchange", () => {
  setTimeout(() => refit(true), 350);
  setTimeout(() => refit(true), 800);
});
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener("change", () => setTimeout(() => refit(true), 350));
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  // Nach längerer Pause zurück auf „Jetzt“, damit nichts Veraltetes stehen bleibt.
  if (when && Date.now() - hiddenAt > 300000) setWhen(null);
  else if (current && !when) { load(); prefetchOther(); }
});

applyTiles();
$("worker").value = store.get("worker") || "";
if (!store.get("worker")) { draft = clone(cfg); buildSetup(); $("setup").classList.add("open"); }
if (current) select(current);
</script>
