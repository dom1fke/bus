<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1720">
<title>Bus Naurod</title>
<style>
  :root {
    --bg: #f3f5f7; --fg: #101820; --muted: #5b6875; --card: #ffffff;
    --line: #dde3e8; --accent: #0b6b4f; --accent-fg: #ffffff;
    --late: #b3261e; --ok: #0b6b4f; --soon: #b45309;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1720; --fg: #eef2f5; --muted: #93a1ae; --card: #17212c;
      --line: #263341; --accent: #3ec99a; --accent-fg: #07251b;
      --late: #ff8a80; --ok: #3ec99a; --soon: #ffb454; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); margin: 0; min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
  .tools { display: flex; gap: 8px; flex: none; }
  .iconbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--accent); padding: 0; }
  .iconbtn svg { display: block; }
  .iconbtn.on { background: var(--accent); color: var(--accent-fg); }
  .chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px;
    padding: 6px 6px 6px 14px; border: 1px solid var(--accent); border-radius: 12px; color: var(--accent); font-size: 15px; }
  .chip[hidden] { display: none; }
  .chip button { flex: none; width: 36px; height: 36px; border: 0; border-radius: 8px;
    background: transparent; color: inherit; font: inherit; font-size: 18px; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .5);
    display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
  .sheet[hidden] { display: none; }
  .panel { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px; margin-bottom: env(safe-area-inset-bottom, 0px); }
  .panel h2 { font-size: 17px; margin: 0; }
  .panel label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  .panel input { display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 46px;
    -webkit-appearance: none; appearance: none; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-align: left; }
  .panel input::-webkit-date-and-time-value { text-align: left; min-width: 0; }
  .panel input::-webkit-datetime-edit { padding: 0; }
  .panel .row { display: flex; gap: 8px; margin-top: 16px; }
  .panel .row button { flex: 1; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  .panel .row button.sec { background: transparent; color: var(--accent); }
  .panel .err { color: var(--late); font-size: 14px; margin-top: 8px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button.dir { font: inherit; font-size: 22px; font-weight: 700; padding: 16px 14px 14px; min-height: 112px;
    border-radius: 14px; border: 2px solid var(--accent); background: transparent;
    color: var(--accent); text-align: left; position: relative;
    transition: opacity .25s ease, background-color .25s ease, color .25s ease; }
  button.dir small { display: block; font-size: 13px; line-height: 1.3; font-weight: 500; color: var(--muted); margin-top: 4px; }
  button.dir[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  button.dir[aria-pressed="true"] small { color: inherit; opacity: .8; }
  .buttons.has-sel button.dir[aria-pressed="false"] { opacity: .5; }
  .dep.fade { animation: rise .35s ease-out both; animation-delay: calc(var(--i, 0) * 80ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .dep.fade { animation: none; } button.dir { transition: none; } }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #out { margin-top: 10px; display: grid; gap: 0; }
  .dep { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 2px; }
  .dep:first-child { border-bottom-color: var(--accent); }
  .badge { min-width: 48px; text-align: center; font-weight: 700; padding: 6px 8px;
    border-radius: 8px; background: var(--accent); color: var(--accent-fg); }
  .dest { min-width: 0; overflow-wrap: anywhere; font-size: 17px; line-height: 1.3; }
  .dest span { display: block; color: var(--muted); font-size: 14px; }
  .late, .dest span.late { color: var(--late); font-weight: 600; }
  .dep { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .dep[data-ref] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .dep:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .chev { display: inline-block; margin-left: 4px; transition: transform .2s ease; }
  .dep.open .chev { transform: rotate(180deg); }
  .trace { grid-column: 1 / -1; margin: 12px 0 4px 22px; border-left: 2px solid var(--line);
    padding-left: 18px; display: grid; gap: 12px; cursor: pointer; }
  .trace .note { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .stop { display: flex; justify-content: space-between; gap: 10px; position: relative; font-size: 15px; }
  .stop > span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .stop::before { content: ""; position: absolute; left: -26px; top: 6px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .stop.first::before, .stop.last::before { background: var(--accent); }
  .stop.last { font-weight: 600; }
  .stop .t { font-variant-numeric: tabular-nums; color: var(--muted); }
  .stop .t.l { color: var(--late); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  .eta { text-align: right; font-variant-numeric: tabular-nums; }
  .eta strong { font-size: 28px; display: block; line-height: 1.1; }
  .eta span { font-size: 14px; color: var(--muted); }
  .eta.soon strong { color: var(--soon); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .eta.soon strong { animation: none; } }
  .msg { color: var(--muted); padding: 12px 2px; overflow-wrap: anywhere; }
  .msg.err { color: var(--late); }
  .foot { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex;
    justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .foot button { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted);
    text-decoration: underline; padding: 4px 0; }
  #setup { margin-top: 20px; display: none; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; }
  #setup.open { display: block; }
  #setup label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  #setup input { width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #setup .row { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  #setup .row button { font: inherit; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  #setup .row button.sec { background: transparent; color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Bus Naurod ⇄ Wiesbaden</h1>
    <div class="tools">
    <button id="when" class="iconbtn" type="button" aria-label="Tag und Uhrzeit wählen">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    </button>
    </div>
  </div>

  <div class="buttons">
    <button class="dir" id="btnIn" aria-pressed="false">In die Stadt
      <small>Fondetter Straße → Dernsches Gelände</small></button>
    <button class="dir" id="btnOut" aria-pressed="false">Aus der Stadt
      <small>Wilhelmstraße → Fondetter Straße</small></button>
  </div>

  <div id="whenChip" class="chip" hidden>
    <span id="whenText"></span>
    <button id="whenClear" type="button" aria-label="Zurück zu Jetzt">✕</button>
  </div>

  <div id="out" aria-live="polite"></div>

  <div class="foot">
    <span id="stamp"></span>
    <button id="openSetup">Einstellungen</button>
  </div>

  <section id="setup">
    <label for="worker">Worker-Adresse (https://….workers.dev)</label>
    <input id="worker" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <button id="saveKey">Speichern</button>    </div>
  </section>
</main>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <h2 id="sheetTitle">Abfahrtszeit wählen</h2>
    <label for="wDate">Tag</label>
    <input id="wDate" type="date">
    <label for="wTime">Uhrzeit</label>
    <input id="wTime" type="time">
    <div class="err" id="wErr" aria-live="polite"></div>
    <div class="row">
      <button id="wNow" class="sec" type="button">Zurück zu Jetzt</button>
      <button id="wApply" type="button">Übernehmen</button>
    </div>
  </div>
</div>

<script>
"use strict";
// ---- Konfiguration -------------------------------------------------------
// Adresse deines Cloudflare Workers; wird in den Einstellungen gespeichert.
const LINES = ["20", "21", "22", "N20"];
const STOPS = {
  naurod: { query: "Naurod Fondetter Straße", mustContain: "fondetter", id: "3025442", name: "WI-Naurod Fondetter Straße" },
  stadt:  { query: "Wiesbaden Wilhelmstraße",  mustContain: "wilhelmstra" },
  ziel:   { query: "Wiesbaden Dernsches Gelände", mustContain: "dern" }
};
const ROUTES = {
  in:  { from: "naurod", to: "ziel" },
  out: { from: "stadt",  to: "naurod" }
};

// ---- Speicher (kann in privaten Fenstern fehlen) --------------------------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const $ = (id) => document.getElementById(id);
let current = store.get("dir") || null;
let timer = null;
let when = null;   // gewählte Abfahrtszeit (nur im Speicher), null = jetzt
let hiddenAt = 0;
let routeIds = null;      // Haltestellen der aktuellen Richtung (für den Fahrtverlauf)
let openRow = null;       // gerade aufgeklappter Eintrag
const traceCache = new Map();
let animateNext = true;   // Einträge nur beim Öffnen und beim Wechsel einblenden, nicht bei jeder Aktualisierung

// ---- Hilfsfunktionen -----------------------------------------------------
function norm(s) {
  return (s || "").toLowerCase().replace(/ß/g, "ss").replace(/straße/g, "strasse");
}

async function hapi(path, params) {
  let base = (store.get("worker") || "").trim().replace(/\/+$/, "");
  if (!base) throw new Error("Noch keine Worker-Adresse gespeichert. Unter „Einstellungen“ eintragen.");
  const qs = new URLSearchParams(params);
  let res;
  try {
    // Der RMV-Schlüssel liegt als Secret im Worker, nicht in der App.
    res = await fetch(base + "/" + path + "?" + qs.toString());
  } catch (e) {
    throw new Error("Keine Verbindung zum Worker. Adresse und Internet prüfen.");
  }
  if (!res.ok) throw new Error("Worker/RMV antwortet mit Fehler " + res.status + ".");
  const data = await res.json();
  if (data.errorCode) throw new Error("RMV: " + (data.errorText || data.errorCode));
  return data;
}

async function stopId(name) {
  const cfg = STOPS[name];
  if (cfg.id) return cfg.id;
  const cached = store.get("stop_" + name);
  if (cached) return cached;
  const data = await hapi("location.name", { input: cfg.query });
  const list = (data.stopLocationOrCoordLocation || [])
    .map((x) => x.StopLocation).filter(Boolean);
  const hit = list.find((s) => norm(s.name).includes(cfg.mustContain)) || list[0];
  if (!hit) throw new Error("Haltestelle „" + cfg.query + "“ nicht gefunden.");
  const id = hit.extId || hit.id;
  store.set("stop_" + name, id);
  store.set("stopname_" + name, hit.name);
  return id;
}

function parseTime(date, time) {
  if (!date || !time) return null;
  return new Date(date + "T" + time);
}

function lineOf(d) {
  const p = d.ProductAtStop || {};
  return (p.line || (d.name || "").replace(/^Bus\s*/i, "")).trim();
}

// ---- Fahrtverlauf ----------------------------------------------------------
function journeyId(ref) {
  if (!ref) return null;
  if (/^https?:/i.test(ref)) {
    try { return new URL(ref).searchParams.get("id"); } catch (e) { return null; }
  }
  return ref;
}

async function fetchStops(ref) {
  const id = journeyId(ref);
  if (!id) throw new Error("Für diese Fahrt gibt es keinen Verlauf.");
  const hit = traceCache.get(id);
  if (hit && Date.now() - hit.at < 60000) return hit.stops;
  const data = await hapi("journeyDetail", { id });
  let stops = (data.Stops && data.Stops.Stop) || [];
  if (!Array.isArray(stops)) stops = [stops];
  traceCache.set(id, { at: Date.now(), stops });
  return stops;
}

function stopTimes(s) {
  const planned = parseTime(s.arrDate || s.depDate, s.arrTime || s.depTime);
  const real = parseTime(s.rtArrDate || s.rtDepDate || s.arrDate || s.depDate,
                         s.rtArrTime || s.rtDepTime) || planned;
  return { planned, real };
}

// Von der Einstiegs- bis zur Zielhaltestelle.
function sliceStops(stops) {
  let a = 0, b = stops.length - 1;
  if (routeIds) {
    const i = stops.findIndex((s) => String(s.extId || "") === String(routeIds.fromId));
    if (i >= 0) a = i;
    let j = stops.findIndex((s, k) => k > a && String(s.extId || "") === String(routeIds.toId));
    if (j < 0) {
      const key = STOPS[routeIds.toKey].mustContain;
      j = stops.findIndex((s, k) => k > a && norm(s.name).includes(key));
    }
    if (j >= 0) b = j;
  }
  return stops.slice(a, b + 1);
}

function fillTrace(box, stops) {
  box.textContent = "";
  const list = sliceStops(stops);
  if (!list.length) { box.textContent = "Kein Verlauf verfügbar."; box.className = "trace note"; return; }
  list.forEach((s, i) => {
    const { planned, real } = stopTimes(s);
    const row = document.createElement("div");
    row.className = "stop" + (i === 0 ? " first" : "") + (i === list.length - 1 ? " last" : "");
    const n = document.createElement("span");
    n.textContent = (s.name || "").replace(/^WI-/, "");
    const t = document.createElement("span");
    t.className = "t";
    if (real) {
      t.textContent = fmt(real);
      if (planned && real - planned >= 60000) t.classList.add("l");
    }
    row.append(n, t);
    box.appendChild(row);
  });
}

function closeRow(el) {
  const box = el.querySelector(".trace");
  if (box) box.remove();
  el.classList.remove("open");
  el.setAttribute("aria-expanded", "false");
  if (openRow === el) openRow = null;
}

function toggleRow(el) {
  if (el.classList.contains("open")) { closeRow(el); return; }
  if (openRow) closeRow(openRow);
  const box = document.createElement("div");
  box.className = "trace";
  const note = document.createElement("div");
  note.className = "note";
  note.textContent = "Lade Verlauf …";
  box.appendChild(note);
  el.appendChild(box);
  el.classList.add("open");
  el.setAttribute("aria-expanded", "true");
  openRow = el;
  fetchStops(el.dataset.ref).then((stops) => {
    if (!box.isConnected) return;
    fillTrace(box, stops);
    el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }).catch((e) => {
    if (!box.isConnected) return;
    note.textContent = "Verlauf nicht verfügbar. " + (e.message || "");
  });
}

function fmt(d) {
  return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

const p2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const hm = (d) => p2(d.getHours()) + ":" + p2(d.getMinutes());
function dayLabel(d) {
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}

// ---- Abfrage -------------------------------------------------------------
async function load() {
  const out = $("out");
  if (!current) { out.innerHTML = ""; return; }
  const route = ROUTES[current];
  try {
    const fromId = await stopId(route.from);
    const toId = await stopId(route.to);
    routeIds = { fromId, toId, toKey: route.to };
    const params = {
      id: fromId, direction: toId, lines: LINES.join(","), maxJourneys: 15, duration: 120
    };
    if (when) { params.date = ymd(when); params.time = hm(when); }
    let data = await hapi("departureBoard", params);
    let deps = data.Departure || [];
    deps = deps.filter((d) => LINES.includes(lineOf(d)));
    render(deps);
  } catch (e) {
    out.innerHTML = "";
    const m = document.createElement("div");
    m.className = "msg err";
    m.textContent = e.message || String(e);
    out.appendChild(m);
  }
}

function render(deps) {
  const out = $("out");
  out.innerHTML = "";
  const anim = animateNext;
  animateNext = false;
  openRow = null;
  const now = new Date();
  const ref = when || now;
  const rows = deps.map((d) => {
    const plan = parseTime(d.date, d.time);
    const real = parseTime(d.rtDate || d.date, d.rtTime) || plan;
    return { d, plan, real, cancelled: d.cancelled === true || d.cancelled === "true" };
  }).filter((r) => r.real && r.real >= new Date(ref.getTime() - 30000))
    .sort((a, b) => a.real - b.real)
    .slice(0, 8);

  if (!rows.length) {
    const m = document.createElement("div");
    m.className = "msg";
    m.textContent = when
      ? "Keine Abfahrten der Linien 20, 21, 22 oder N20 in den 2 Stunden ab " + fmt(when) + "."
      : "Keine Abfahrten der Linien 20, 21, 22 oder N20 in den nächsten 2 Stunden.";
    out.appendChild(m);
  }

  rows.forEach((r, i) => {
    const mins = Math.max(0, Math.round((r.real - now) / 60000));
    const delay = Math.round((r.real - r.plan) / 60000);
    const el = document.createElement("div");
    el.className = "dep";
    if (anim) { el.classList.add("fade"); el.style.setProperty("--i", i); }
    const ref = r.d.JourneyDetailRef && r.d.JourneyDetailRef.ref;
    if (ref) {
      el.dataset.ref = ref;
      el.setAttribute("role", "button");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-expanded", "false");
    }

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = lineOf(r.d);

    const dest = document.createElement("div");
    dest.className = "dest";
    dest.textContent = r.d.direction || "";
    const sub = document.createElement("span");
    if (r.cancelled) { sub.textContent = "Fällt aus"; sub.className = "late"; }
    else if (delay > 0) { sub.textContent = "+" + delay + " min · Plan " + fmt(r.plan); sub.className = "late"; }
    else { sub.textContent = r.d.rtTime ? "pünktlich" : "laut Fahrplan"; }
    dest.appendChild(sub);

    const eta = document.createElement("div");
    eta.className = "eta";
    const big = document.createElement("strong");
    if (when) {
      big.textContent = fmt(r.real);
    } else {
      big.textContent = mins === 0 ? "jetzt" : mins + " min";
      if (!r.cancelled && mins <= 5) eta.classList.add("soon");
    }
    const t = document.createElement("span");
    t.textContent = (when ? dayLabel(r.real) : fmt(r.real)) + " ";
    if (ref) {
      const chev = document.createElement("span");
      chev.className = "chev";
      chev.setAttribute("aria-hidden", "true");
      chev.textContent = "⌄";
      t.appendChild(chev);
    }
    eta.append(big, t);

    el.append(badge, dest, eta);
    out.appendChild(el);
  });

  $("stamp").textContent = "Stand " + fmt(new Date());

  // So viele Einträge zeigen, wie ohne Scrollen passen (mindestens 3, höchstens 8).
  let padB = parseFloat(getComputedStyle(document.querySelector("main")).paddingBottom) || 0;
  // Der Home-Balken ist dünn, ein kleiner Abstand reicht, damit möglichst viel Platz genutzt wird.
  padB = Math.min(padB, 10);
  const foot = document.querySelector(".foot");
  while (out.children.length > 3 && foot.getBoundingClientRect().bottom + padB > window.innerHeight) {
    out.removeChild(out.lastElementChild);
  }
}

// ---- Bedienung -----------------------------------------------------------
function select(dir) {
  current = dir;
  animateNext = true;
  store.set("dir", dir);
  document.querySelector(".buttons").classList.add("has-sel");
  $("btnIn").setAttribute("aria-pressed", String(dir === "in"));
  $("btnOut").setAttribute("aria-pressed", String(dir === "out"));
  $("out").innerHTML = '<div class="msg">Lade Abfahrten …</div>';
  load();
  clearInterval(timer);
  // Solange ein Verlauf aufgeklappt ist, bleibt die Liste stehen.
  timer = setInterval(() => { if (!when && !openRow) load(); }, 30000);
}

$("btnIn").addEventListener("click", () => select("in"));
$("btnOut").addEventListener("click", () => select("out"));
$("openSetup").addEventListener("click", () => $("setup").classList.toggle("open"));

function updateWhenUI() {
  $("when").classList.toggle("on", !!when);
  if (when) {
    $("whenText").textContent = "Abfahrten ab " + dayLabel(when) + ", " + fmt(when);
    $("whenChip").hidden = false;
  } else {
    $("whenChip").hidden = true;
  }
}
function setWhen(d) {
  when = d;
  updateWhenUI();
  if (current) select(current);
}
function openSheet() {
  const base = when || new Date();
  $("wDate").min = ymd(new Date());
  $("wDate").value = ymd(base);
  $("wTime").value = hm(base);
  $("wErr").textContent = "";
  $("sheet").hidden = false;
}
function closeSheet() { $("sheet").hidden = true; }

$("when").addEventListener("click", openSheet);
$("out").addEventListener("click", (e) => {
  // Ein Tipp irgendwo im Eintrag, auch auf den Verlauf selbst, klappt auf oder zu.
  const row = e.target.closest(".dep[data-ref]");
  if (row) toggleRow(row);
});
$("out").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest && e.target.closest(".dep[data-ref]");
  if (row && e.target === row) { e.preventDefault(); toggleRow(row); }
});
$("wApply").addEventListener("click", () => {
  const d = $("wDate").value, t = $("wTime").value;
  if (!d || !t) { $("wErr").textContent = "Bitte Tag und Uhrzeit wählen."; return; }
  const sel = new Date(d + "T" + t);
  if (isNaN(sel.getTime())) { $("wErr").textContent = "Diese Zeit ist ungültig."; return; }
  if (sel.getTime() < Date.now() - 5 * 60000) {
    $("wErr").textContent = "Die gewählte Zeit liegt in der Vergangenheit."; return;
  }
  closeSheet();
  setWhen(sel.getTime() - Date.now() < 120000 ? null : sel);
});
$("wNow").addEventListener("click", () => { closeSheet(); setWhen(null); });
$("whenClear").addEventListener("click", () => setWhen(null));
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("saveKey").addEventListener("click", () => {
  const w = $("worker").value.trim();
  if (w) { store.set("worker", w); $("setup").classList.remove("open"); if (current) select(current); }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  // Nach längerer Pause zurück auf „Jetzt“, damit nichts Veraltetes stehen bleibt.
  if (when && Date.now() - hiddenAt > 300000) setWhen(null);
  else if (current && !when) { animateNext = true; load(); }
});

$("worker").value = store.get("worker") || "";
if (!store.get("worker")) $("setup").classList.add("open");
if (current) select(current);
</script>
</body>
</html>
