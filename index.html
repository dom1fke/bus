<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1015">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7">
<title>Bus Naurod</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --surface2: #e9ecf0; --line: #e4e7eb;
    --fg: #0f141a; --muted: #5b6573; --faint: #9aa3ae;
    --accent: #0e9f6e; --accent-fg: #ffffff; --segsel: #ffffff;
    --late: #dc2626; --ok: #0e9f6e; --soon: #d97706;
    --shadow: 0 1px 3px rgba(16, 24, 40, .10);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1015; --card: #161a21; --surface2: #1d222b; --line: #252b35;
      --fg: #f3f5f8; --muted: #8a94a3; --faint: #5c6573;
      --accent: #34d399; --accent-fg: #052e22; --segsel: #2b323d;
      --late: #ff6b6b; --ok: #34d399; --soon: #ff9f0a;
      --shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 480px; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, [role="button"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- Kopf ---- */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .ttl { min-width: 0; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
  .live { display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; padding: 2px 0;
    font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .live.err i { background: var(--late); box-shadow: 0 0 0 3px color-mix(in srgb, var(--late) 22%, transparent); }
  .live b { font-weight: 400; display: inline-block; opacity: .75; }
  .live.busy b { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .whenchip { display: inline-flex; align-items: center; gap: 8px; margin-top: 5px; padding: 3px 4px 3px 11px;
    border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
    font-size: 13px; font-weight: 600; }
  .whenchip button { width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 26%, transparent); color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
  .tools { display: flex; gap: 8px; flex: none; margin-top: 2px; }
  .iconbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; cursor: pointer;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .iconbtn svg { display: block; width: 20px; height: 20px; }
  .iconbtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

  /* ---- Richtung ---- */
  .seg { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
    background: var(--surface2); border-radius: 14px; }
  .seg button { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 6px; border: 0; border-radius: 11px;
    background: transparent; color: var(--muted); cursor: pointer; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background-color .2s ease, color .2s ease, box-shadow .2s ease; }
  .seg button[aria-pressed="true"] { background: var(--segsel); color: var(--fg); box-shadow: var(--shadow); }
  .route { display: flex; align-items: center; gap: 8px; margin: 12px 2px 0; font-size: 14px; color: var(--muted); min-width: 0; }
  .route .d { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); flex: none; }
  .route .d.f { background: var(--accent); }
  .route .ln { flex: 0 0 16px; height: 2px; background: var(--line); }
  .route strong { color: var(--fg); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- Nächster Bus ---- */
  .hero { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 15px 16px 13px; -webkit-user-select: none; user-select: none; }
  .hero[data-ref] { cursor: pointer; }
  .hero.soon { border-color: color-mix(in srgb, var(--soon) 60%, var(--line)); }
  .hero .k { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hero .k em { font-style: normal; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--soon);
    display: flex; align-items: center; gap: 6px; }
  .hero .k em i { width: 8px; height: 8px; border-radius: 50%; background: var(--soon); animation: pulse 1.4s ease-in-out infinite; }
  .hrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 8px; }
  .big { font-size: 64px; font-weight: 800; letter-spacing: -.04em; line-height: .95; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  .big.long { font-size: 46px; }
  .big small { font-size: 22px; font-weight: 700; letter-spacing: 0; margin: 0 .2em 0 .12em; color: var(--muted); }
  .big small:last-child { margin-right: 0; }
  .hero.soon .big, .hero.soon .big small { color: var(--soon); }
  .hero.soon .big { animation: pulse 1.4s ease-in-out infinite; }
  .meta { text-align: right; font-size: 14px; color: var(--muted); min-width: 0; }
  .meta b { display: block; font-size: 20px; color: var(--fg); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meta b s { color: var(--faint); font-weight: 500; font-size: 15px; margin-right: 4px; }
  .meta b .late { color: var(--late); }
  .hdest { display: flex; align-items: center; gap: 10px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
  .hdest .hd { font-size: 16px; font-weight: 600; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
  .hdest .st { margin-left: auto; flex: none; font-size: 13px; font-weight: 600; color: var(--ok); display: flex; align-items: center; gap: 5px; }
  .hdest .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .hdest .st.late { color: var(--late); }
  .hdest .st.plan { color: var(--muted); font-weight: 500; }
  .hdest .st.plan::before { display: none; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ---- Linien ---- */
  .badge { flex: none; min-width: 42px; height: 28px; padding: 0 8px; border-radius: 8px; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; background: var(--lc, var(--accent)); color: var(--lt, #fff); }

  /* ---- Liste ---- */
  .lh { display: flex; justify-content: space-between; margin: 18px 2px 7px; font-size: 12px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lh .hint { opacity: .8; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .list:empty { display: none; }
  .lh[hidden] + .list { margin-top: 14px; }
  .dep { display: grid; grid-template-columns: auto 1fr auto 12px; gap: 12px; align-items: center;
    padding: 11px 14px; border-top: 1px solid var(--line);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .dep:first-child { border-top: 0; }
  .dep[data-ref] { cursor: pointer; }
  .dep.open { background: var(--surface2); }
  .dest { min-width: 0; }
  .dest div { font-weight: 600; font-size: 15.5px; line-height: 1.25; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
  .dest span { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .dest span.late, .late { color: var(--late); font-weight: 600; }
  .dest span.ok { color: var(--ok); }
  .eta { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .eta strong { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
  .eta strong .u { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 .25em 0 .1em; }
  .eta strong .u:last-child { margin-right: 0; }
  .eta span { font-size: 13px; color: var(--muted); }
  .eta s { color: var(--faint); margin-right: 4px; }
  .eta.soon strong, .eta.soon strong .u { color: var(--soon); }
  .eta.soon strong { animation: pulse 1.4s ease-in-out infinite; }
  .chev { color: var(--faint); font-size: 14px; text-align: center; transition: transform .2s ease; }
  .open > .chev, .hero.open .chev { transform: rotate(180deg); }
  .dep.x .dest div { text-decoration: line-through; color: var(--muted); }
  .dep.x .eta strong, .dep.x .eta strong .u { color: var(--faint); }
  .pill { display: inline-block !important; font-size: 11.5px !important; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-top: 3px !important;
    background: color-mix(in srgb, var(--late) 18%, transparent); color: var(--late) !important; }
  .hdest .chev { flex: none; width: 12px; }

  /* ---- Fahrtverlauf ---- */
  .trace { grid-column: 1 / -1; margin: 6px 0 2px 20px; border-left: 2px solid var(--line);
    padding: 2px 0 2px 18px; display: grid; gap: 10px; cursor: pointer; }
  .hero .trace { margin: 14px 0 2px 20px; }
  .trace .note { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .stop { display: flex; justify-content: space-between; gap: 10px; position: relative; font-size: 14px; }
  .stop > span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .stop::before { content: ""; position: absolute; left: -25px; top: 4px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--card); border: 2px solid var(--lc, var(--accent)); }
  .dep.open .stop::before { background: var(--surface2); }
  .stop.first::before, .stop.last::before { background: var(--lc, var(--accent)) !important; }
  .stop.last { font-weight: 700; }
  .stop .t { font-variant-numeric: tabular-nums; color: var(--muted); }
  .stop .t.l { color: var(--late); font-weight: 600; }

  /* ---- Einblenden ---- */
  .fade { animation: rise .35s ease-out both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade.slide { animation-name: slidein; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes slidein { from { opacity: 0; transform: translateX(var(--dx, 40px)); } to { opacity: 1; transform: none; } }

  /* ---- Platzhalter ---- */
  .skel { pointer-events: none; }
  .sk { background: var(--line); border-radius: 6px; animation: pulse 1.2s ease-in-out infinite; }
  .dep.skel .badge { background: var(--line); }
  .sk.l1 { height: 16px; width: 70%; margin-bottom: 7px; }
  .sk.l2 { height: 11px; width: 35%; }
  .sk.e1 { height: 20px; width: 64px; margin: 0 0 6px auto; }
  .sk.e2 { height: 11px; width: 44px; margin-left: auto; }
  .hero.skel .sk.h1 { height: 54px; width: 120px; margin-top: 10px; }
  .hero.skel .sk.h2 { height: 18px; width: 60%; margin-top: 16px; }

  .msg { color: var(--muted); padding: 14px; overflow-wrap: anywhere; }
  .msg.err { color: var(--late); }

  @media (prefers-reduced-motion: reduce) {
    .fade, .eta.soon strong, .hero.soon .big, .hero .k em i, .sk, .live.busy b { animation: none; }
    .seg button, .chev { transition: none; }
  }

  /* ---- Abfahrtszeit-Fenster ---- */
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .5);
    display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
  .panel { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px; margin-bottom: env(safe-area-inset-bottom, 0px); }
  .panel h2 { font-size: 17px; margin: 0; }
  .panel label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  .panel input { display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 46px;
    -webkit-appearance: none; appearance: none; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-align: left; }
  .panel input::-webkit-date-and-time-value { text-align: left; min-width: 0; }
  .panel input::-webkit-datetime-edit { padding: 0; }
  .panel .row { display: flex; gap: 8px; margin-top: 16px; }
  .panel .row button { flex: 1; font: inherit; font-weight: 600; padding: 12px; border-radius: 12px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  .panel .row button.sec { background: transparent; color: var(--accent); }
  .panel .err { color: var(--late); font-size: 14px; margin-top: 8px; }

  /* ---- Einstellungen ---- */
  /* Eigenes Fenster: auf dem Handy bildschirmfüllend, auf großen Bildschirmen mittig */
  .settings { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain; animation: sheetin .28s ease-out; }
  @keyframes sheetin { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .setbox { max-width: 520px; margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .setbar { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; padding: max(10px, env(safe-area-inset-top)) 0 10px; background: var(--bg);
    border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .setbar h2 { margin: 0; font-size: 17px; font-weight: 700; text-align: center; }
  .setbar button { font: inherit; font-size: 16px; color: var(--accent); background: none; border: 0; padding: 8px 0;
    justify-self: start; cursor: pointer; }
  .setbar button.strong { font-weight: 700; justify-self: end; }
  @media (min-width: 700px) and (min-height: 560px) {
    .settings { background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 24px;
      animation: fadein .2s ease-out; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .setbox { width: 100%; max-height: 100%; overflow-y: auto; background: var(--bg); border: 1px solid var(--line);
      border-radius: 22px; padding: 0 20px 20px; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
    .setbar { padding-top: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .settings { animation: none; } }
  #setup { padding-bottom: 8px; }
  #setup label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  #setup input { width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #setup .row { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  #setup .row button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 12px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  #setup h2 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px; }
  #setup .group { border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; margin-bottom: 10px; background: var(--card); }
  #setup .ghead { display: flex; align-items: center; gap: 8px; padding: 8px 0 6px; }
  #setup input.gname { flex: 1; min-width: 0; font: inherit; font-size: 18px; font-weight: 700; color: var(--fg);
    background: transparent; border: 0; padding: 4px 0; border-radius: 6px; }
  #setup .gedit { flex: none; font-size: 13px; color: var(--muted); }
  #setup button.field { display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 0; text-align: left;
    font: inherit; color: var(--fg); background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
  #setup button.field:disabled { color: var(--muted); }
  #setup .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); flex: none; }
  #setup .dot.f { background: var(--accent); }
  #setup .lbl { width: 40px; flex: none; font-size: 13px; color: var(--muted); }
  #setup .val { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #setup .arrow { color: var(--muted); flex: none; }
  #setup .lines { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 0 12px;
    border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #setup .lines .lbl { margin-right: 2px; }
  #setup .lchip { font: inherit; font-size: 13px; font-weight: 800; min-width: 40px; padding: 4px 10px; border-radius: 7px;
    border: 1px solid transparent; background: var(--lc, var(--accent)); color: var(--lt, #fff); }
  #setup .lchip[aria-pressed="false"] { background: transparent; border-color: var(--line); color: var(--muted);
    font-weight: 500; text-decoration: line-through; }
  #setup .switch { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted);
    margin: 2px 0 12px 2px; cursor: pointer; }
  #setup .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #setup .tgl { width: 42px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none;
    transition: background-color .2s ease; }
  #setup .tgl::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform .2s ease; }
  #setup .switch input:checked + .tgl { background: var(--accent); }
  #setup .switch input:checked + .tgl::after { transform: translateX(16px); }
  #setup .switch input:focus-visible + .tgl { outline: 3px solid var(--accent); outline-offset: 2px; }
  #setup .wlabel { margin-top: 14px; }

  /* ---- Haltestellensuche ---- */
  .picker { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pkin { max-width: 480px; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .pkback { font: inherit; font-size: 16px; color: var(--accent); background: none; border: 0; padding: 6px 0; }
  .picker h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 12px; }
  #pkInput { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--accent);
    background: var(--card); color: var(--fg); -webkit-appearance: none; appearance: none; }
  #pkInput:focus-visible { outline: none; }
  .pkopt { display: block; width: 100%; text-align: left; font: inherit; color: var(--fg); background: none; border: 0;
    border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 4px; overflow-wrap: anywhere; }
  .pkopt b { color: var(--accent); font-weight: 700; }
  .pknote { color: var(--muted); font-size: 14px; padding: 14px 4px; }
  .pkhead { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 2px 2px; }

  .side { display: contents; }

  /* ---- Handy quer und breite Fenster: zwei Spalten ---- */
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse),
         (orientation: landscape) and (min-width: 800px) {
    main { max-width: 1000px; display: grid; grid-template-columns: minmax(260px, 34%) 1fr; column-gap: 20px;
      padding-left: max(12px, calc(env(safe-area-inset-left) - 16px));
      padding-right: max(12px, calc(env(safe-area-inset-right) - 16px));
      grid-template-areas: "side col"; align-items: start; }
    .notch-left main { padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(12px, calc(env(safe-area-inset-right) - 36px)); }
    .notch-right main { padding-right: max(16px, env(safe-area-inset-right));
      padding-left: max(12px, calc(env(safe-area-inset-left) - 36px)); }
    .side { display: block; grid-area: side; position: sticky; top: max(10px, env(safe-area-inset-top)); }
    .col { grid-area: col; }
    h1 { font-size: 24px; }
    .seg { margin-top: 12px; }
    .route { margin-top: 8px; font-size: 13px; flex-wrap: wrap; row-gap: 2px; }
    .route strong { white-space: normal; }
    .hero { margin-top: 10px; padding: 11px 14px 10px; }
    .big { font-size: 46px; } .big.long { font-size: 36px; }
    .big small { font-size: 18px; }
    .hrow { margin-top: 6px; }

    .sheet { align-items: center; }
  }

  /* ---- Computer mit Maus und großem Fenster: mittige Karte ---- */
  @media (pointer: fine) and (min-width: 1000px) and (min-height: 600px) {
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 32px 24px; }
    main { width: 100%; max-width: 1180px; margin: 0; padding: 32px 36px;
      grid-template-columns: 360px 1fr; column-gap: 36px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 26px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28); }
    body { background: color-mix(in srgb, var(--bg) 82%, #000); }
    .side { position: static; }
    h1 { font-size: 30px; }
    .big { font-size: 60px; } .big.long { font-size: 44px; }

    .seg button:hover { color: var(--fg); }
    .dest div { font-size: 17px; }

  }
</style>
</head>

<script>
"use strict";
// ---- Konfiguration -------------------------------------------------------
// Adresse deines Cloudflare Workers; wird in den Einstellungen gespeichert.
// Haltestellen je Richtung; in den Einstellungen änderbar. Ohne gespeicherte
// Kennung (id) wird die Haltestelle beim ersten Abruf per Name gesucht.
const NAUROD = { id: "3025442", name: "WI-Naurod Fondetter Straße", label: "Fondetter Straße" };
const DEFAULT_CFG = {
  mirror: false,
  in:  { name: "In die Stadt",  off: [], from: NAUROD,
         to: { query: "Wiesbaden Dernsches Gelände", must: "dern", label: "Dernsches Gelände" } },
  out: { name: "Aus der Stadt", off: [], to: NAUROD,
         from: { query: "Wiesbaden Wilhelmstraße", must: "wilhelmstra", label: "Wilhelmstraße" } }
};

// ---- Speicher (kann in privaten Fenstern fehlen) --------------------------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const $ = (id) => document.getElementById(id);
let current = store.get("dir") || null;
let timer = null;
let when = null;   // gewählte Abfahrtszeit (nur im Speicher), null = jetzt
let hiddenAt = 0;
let routeIds = null;      // Haltestellen der aktuellen Richtung (für den Fahrtverlauf)
let openRow = null;       // gerade aufgeklappter Eintrag
const traceCache = new Map();
let slideFrom = 0;        // Richtung der Einblendung nach einem Wischen (px), 0 = normal
let animateNext = true;   // Einträge nur beim Öffnen und beim Wechsel einblenden, nicht bei jeder Aktualisierung
let lastDeps = null;      // letzte Abfahrten, um nach dem Drehen neu einzupassen

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function loadCfg() {
  let c = null;
  try { c = JSON.parse(store.get("cfg") || "null"); } catch (e) { c = null; }
  if (!c || !c.in || !c.out) {
    c = clone(DEFAULT_CFG);
    // Bereits früher gefundene Haltestellen übernehmen.
    const z = store.get("stop_ziel"), s = store.get("stop_stadt");
    if (z) { c.in.to.id = z; c.in.to.name = store.get("stopname_ziel") || c.in.to.label; }
    if (s) { c.out.from.id = s; c.out.from.name = store.get("stopname_stadt") || c.out.from.label; }
  }
  return c;
}
let cfg = loadCfg();
function saveCfg() { store.set("cfg", JSON.stringify(cfg)); }

// Start, Ziel, Name und abgewählte Linien einer Richtung.
function routeOf(c, dir) {
  const r = c[dir];
  if (dir === "out" && c.mirror) return { name: r.name, off: r.off || [], from: c.in.to, to: c.in.from };
  return { name: r.name, off: r.off || [], from: r.from, to: r.to };
}
function shortName(n) {
  return (n || "").replace(/^(Wiesbaden|WI)[\s-]+/i, "").trim();
}
function stopLabel(s) { return (s && (s.label || shortName(s.name))) || "–"; }
function seenKey(fromId, toId) { return "seen_" + fromId + "_" + toId; }
function seenLines(fromId, toId) {
  try { return JSON.parse(store.get(seenKey(fromId, toId)) || "[]"); } catch (e) { return []; }
}
const byLine = (a, b) => a.localeCompare(b, "de", { numeric: true });

// Ort einer Haltestelle, z. B. „WI-Naurod Fondetter Straße“ → „Naurod“,
// „Wiesbaden Dernsches Gelände“ → „Wiesbaden“.
function placeOf(s) {
  const n = ((s && (s.name || s.query)) || "").replace(/^WI-/i, "").trim();
  return n.split(/\s+/)[0] || "";
}
function applyTitle() {
  const r = routeOf(cfg, "in");
  let a = placeOf(r.from), b = placeOf(r.to);
  // Liegen beide Haltestellen im selben Ort, die Haltestellen selbst nennen.
  if (!a || !b || a === b) { a = stopLabel(r.from); b = stopLabel(r.to); }
  document.title = "Bus " + a + " ⇄ " + b;
}
function applyTiles() {
  applyTitle();
  [["in", "btnIn"], ["out", "btnOut"]].forEach(([dir, id]) => {
    $(id).textContent = routeOf(cfg, dir).name || (dir === "in" ? "In die Stadt" : "Aus der Stadt");
  });
  applyRoute();
}
// Strecke unter dem Umschalter: ● Start — ○ Ziel
function applyRoute() {
  const r = routeOf(cfg, current || "in");
  const box = $("route");
  box.innerHTML = '<span class="d f"></span><strong></strong><span class="ln"></span><span class="d"></span><strong></strong>';
  const s = box.querySelectorAll("strong");
  s[0].textContent = stopLabel(r.from);
  s[1].textContent = stopLabel(r.to);
}

// Jede Linie bekommt eine feste Farbe; unbekannte Linien eine aus der Palette.
const LINE_COLORS = { "20": "#ef4444", "21": "#3b82f6", "22": "#f59e0b", "N20": "#8b5cf6" };
const PALETTE = ["#14b8a6", "#ec4899", "#84cc16", "#06b6d4", "#f97316", "#6366f1", "#a855f7", "#10b981", "#e11d48", "#0ea5e9"];
function lineColor(l) {
  if (LINE_COLORS[l]) return LINE_COLORS[l];
  let x = 0;
  for (const c of String(l)) x = (x * 31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[x % PALETTE.length];
}
function paintLine(el, l) {
  const c = lineColor(l);
  const n = parseInt(c.slice(1), 16);
  const lum = 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
  el.style.setProperty("--lc", c);
  el.style.setProperty("--lt", lum > 160 ? "#1a1200" : "#ffffff");
}
// Ziele ohne den gemeinsamen Ortsnamen: „Wiesbaden Hauptbahnhof“ → „Hauptbahnhof“.
function destName(n) {
  return (n || "").replace(/^(Wiesbaden|WI)[\s-]+/i, "").trim() || n || "";
}

// ---- Hilfsfunktionen -----------------------------------------------------
function norm(s) {
  return (s || "").toLowerCase().replace(/ß/g, "ss").replace(/straße/g, "strasse");
}

async function hapi(path, params) {
  let base = (store.get("worker") || "").trim().replace(/\/+$/, "");
  if (!base) throw new Error("Noch keine Worker-Adresse gespeichert. Unter „Einstellungen“ eintragen.");
  const qs = new URLSearchParams(params);
  let res;
  try {
    // Der RMV-Schlüssel liegt als Secret im Worker, nicht in der App.
    res = await fetch(base + "/" + path + "?" + qs.toString());
  } catch (e) {
    throw new Error("Keine Verbindung zum Worker. Adresse und Internet prüfen.");
  }
  if (!res.ok) throw new Error("Worker/RMV antwortet mit Fehler " + res.status + ".");
  const data = await res.json();
  if (data.errorCode) throw new Error("RMV: " + (data.errorText || data.errorCode));
  return data;
}

async function searchStops(text) {
  const data = await hapi("location.name", { input: text, type: "S", maxNo: 12 });
  return (data.stopLocationOrCoordLocation || [])
    .map((x) => x.StopLocation).filter(Boolean)
    .map((s) => ({ id: String(s.extId || s.id), name: s.name }));
}

// Liefert die Kennung einer Haltestelle; fehlt sie, wird einmalig per Name gesucht.
async function stopId(stop) {
  if (stop.id) return stop.id;
  const list = await searchStops(stop.query);
  const hit = list.find((s) => norm(s.name).includes(stop.must || "")) || list[0];
  if (!hit) throw new Error("Haltestelle „" + stop.query + "“ nicht gefunden.");
  stop.id = hit.id;
  stop.name = hit.name;
  saveCfg();
  return stop.id;
}

function parseTime(date, time) {
  if (!date || !time) return null;
  return new Date(date + "T" + time);
}

function lineOf(d) {
  const p = d.ProductAtStop || {};
  return (p.line || (d.name || "").replace(/^Bus\s*/i, "")).trim();
}

// ---- Fahrtverlauf ----------------------------------------------------------
function journeyId(ref) {
  if (!ref) return null;
  if (/^https?:/i.test(ref)) {
    try { return new URL(ref).searchParams.get("id"); } catch (e) { return null; }
  }
  return ref;
}

async function fetchStops(ref) {
  const id = journeyId(ref);
  if (!id) throw new Error("Für diese Fahrt gibt es keinen Verlauf.");
  const hit = traceCache.get(id);
  if (hit && Date.now() - hit.at < 60000) return hit.stops;
  const data = await hapi("journeyDetail", { id });
  let stops = (data.Stops && data.Stops.Stop) || [];
  if (!Array.isArray(stops)) stops = [stops];
  traceCache.set(id, { at: Date.now(), stops });
  return stops;
}

function stopTimes(s) {
  const planned = parseTime(s.arrDate || s.depDate, s.arrTime || s.depTime);
  const real = parseTime(s.rtArrDate || s.rtDepDate || s.arrDate || s.depDate,
                         s.rtArrTime || s.rtDepTime) || planned;
  return { planned, real };
}

// Von der Einstiegs- bis zur Zielhaltestelle.
function sliceStops(stops) {
  let a = 0, b = stops.length - 1;
  if (routeIds) {
    const i = stops.findIndex((s) => String(s.extId || "") === String(routeIds.fromId));
    if (i >= 0) a = i;
    let j = stops.findIndex((s, k) => k > a && String(s.extId || "") === String(routeIds.toId));
    if (j < 0 && routeIds.toName) {
      const key = norm(routeIds.toName);
      j = stops.findIndex((s, k) => k > a && norm(s.name) === key);
    }
    if (j >= 0) b = j;
  }
  return stops.slice(a, b + 1);
}

function fillTrace(box, stops) {
  box.textContent = "";
  const list = sliceStops(stops);
  if (!list.length) { box.textContent = "Kein Verlauf verfügbar."; box.className = "trace note"; return; }
  list.forEach((s, i) => {
    const { planned, real } = stopTimes(s);
    const row = document.createElement("div");
    row.className = "stop" + (i === 0 ? " first" : "") + (i === list.length - 1 ? " last" : "");
    const n = document.createElement("span");
    n.textContent = (s.name || "").replace(/^WI-/, "");
    const t = document.createElement("span");
    t.className = "t";
    if (real) {
      t.textContent = fmt(real);
      if (planned && real - planned >= 60000) t.classList.add("l");
    }
    row.append(n, t);
    box.appendChild(row);
  });
}

function closeRow(el) {
  const box = el.querySelector(".trace");
  if (box) box.remove();
  el.classList.remove("open");
  el.setAttribute("aria-expanded", "false");
  if (openRow === el) openRow = null;
}

function smoothTop(after) {
  if (window.scrollY <= 1) { after(); return; }
  window.scrollTo({ top: 0, behavior: "smooth" });
  const t0 = Date.now();
  (function wait() {
    if (window.scrollY <= 1 || Date.now() - t0 > 900) after();
    else requestAnimationFrame(wait);
  })();
}
function keepVisible(el) {
  // Nach dem Aufklappen so scrollen, dass der ganze Eintrag samt Verlauf sichtbar ist.
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect();
    const vh = window.innerHeight;
    const m = 16;
    let dy = 0;
    if (r.height + 2 * m >= vh || r.top < m) dy = r.top - m;
    else if (r.bottom > vh - m) dy = r.bottom - (vh - m);
    if (dy) window.scrollBy({ top: dy, behavior: "smooth" });
  });
}
function toggleRow(el) {
  if (el.classList.contains("open")) {
    // Erst sanft ganz nach oben scrollen, dann zuklappen, damit die Seite nicht springt.
    smoothTop(() => closeRow(el));
    return;
  }
  if (openRow) closeRow(openRow);
  const box = document.createElement("div");
  box.className = "trace";
  const note = document.createElement("div");
  note.className = "note";
  note.textContent = "Lade Verlauf …";
  box.appendChild(note);
  el.appendChild(box);
  el.classList.add("open");
  el.setAttribute("aria-expanded", "true");
  openRow = el;
  fetchStops(el.dataset.ref).then((stops) => {
    if (!box.isConnected) return;
    fillTrace(box, stops);
    keepVisible(el);
  }).catch((e) => {
    if (!box.isConnected) return;
    note.textContent = "Verlauf nicht verfügbar. " + (e.message || "");
    keepVisible(el);
  });
}

function fmt(d) {
  return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

const p2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const hm = (d) => p2(d.getHours()) + ":" + p2(d.getMinutes());
function dayLabel(d) {
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}

// ---- Abfrage -------------------------------------------------------------
// Beide Richtungen werden vorgehalten, damit der Wechsel ohne Wartezeit klappt.
let cache = {};             // dir -> { key, deps, ids, at }
const pending = {};         // dir -> laufende Abfrage
let animUntil = 0;          // bis wann die Einblendung läuft

function cacheKey(dir) {
  const r = routeOf(cfg, dir);
  return (r.from.id || r.from.query) + "|" + (r.to.id || r.to.query) + "|" + (when ? when.getTime() : "jetzt");
}

function fetchDir(dir) {
  const key = cacheKey(dir);
  if (pending[dir] && pending[dir].key === key) return pending[dir].p;
  const p = (async () => {
    const route = routeOf(cfg, dir);
    const fromId = await stopId(route.from);
    const toId = await stopId(route.to);
    // Ohne Linienfilter: alle Linien, die von der Start- zur Zielhaltestelle fahren.
    const params = { id: fromId, direction: toId, maxJourneys: 20, duration: 720 };
    if (when) { params.date = ymd(when); params.time = hm(when); }
    const data = await hapi("departureBoard", params);
    let deps = data.Departure || [];
    if (!Array.isArray(deps)) deps = [deps];
    // Gefundene Linien merken, damit man sie in den Einstellungen abwählen kann.
    const seen = new Set(seenLines(fromId, toId));
    deps.forEach((d) => { const l = lineOf(d); if (l) seen.add(l); });
    store.set(seenKey(fromId, toId), JSON.stringify([...seen].sort(byLine)));
    const entry = { key: cacheKey(dir), deps, ids: { fromId, toId, toName: route.to.name }, at: Date.now() };
    // Schlüssel erst nach dem Auflösen der Haltestellen vergleichen (Name → Kennung).
    if (entry.key === cacheKey(dir)) cache[dir] = entry;
    return entry;
  })();
  pending[dir] = { key, p };
  p.finally(() => { if (pending[dir] && pending[dir].p === p) delete pending[dir]; }).catch(() => {});
  return p;
}

function fresh(dir, maxAge) {
  const c = cache[dir];
  return c && c.key === cacheKey(dir) && Date.now() - c.at < maxAge ? c : null;
}

function show(entry) {
  routeIds = entry.ids;
  const off = routeOf(cfg, current).off;
  lastDeps = entry.deps.filter((d) => !off.includes(lineOf(d)));
  render(lastDeps);
}

function showSkeleton() {
  const h = $("hero");
  h.hidden = false;
  h.className = "hero skel";
  clearRef(h);
  h.innerHTML = '<div class="sk" style="height:11px;width:96px"></div><div class="sk h1"></div><div class="sk h2"></div>';
  const out = $("out");
  out.innerHTML = "";
  $("listHead").hidden = false;
  for (let i = 0; i < 4; i++) {
    const el = document.createElement("div");
    el.className = "dep skel";
    el.innerHTML = '<div class="badge"></div><div><div class="sk l1"></div><div class="sk l2"></div></div>' +
                   '<div><div class="sk e1"></div><div class="sk e2"></div></div><span></span>';
    out.appendChild(el);
  }
}

function setLive(text, err) {
  $("stamp").textContent = text;
  $("live").classList.toggle("err", !!err);
}

function showError(e) {
  // Stehen schon Abfahrten da, bleiben sie; nur die Live-Anzeige zeigt das Problem.
  if (document.querySelector("#hero:not(.skel):not([hidden]), #out .dep:not(.skel)")) {
    setLive("Aktualisierung fehlgeschlagen", true);
    return;
  }
  $("hero").hidden = true;
  $("listHead").hidden = true;
  setLive("Nicht verbunden", true);
  const out = $("out");
  out.innerHTML = "";
  const m = document.createElement("div");
  m.className = "msg err";
  m.textContent = e.message || String(e);
  out.appendChild(m);
}

// Aktuelle Richtung neu laden. Ohne Einblendung wird nur ersetzt, wenn sich etwas geändert hat.
async function load() {
  if (!current) return;
  const dir = current, key = cacheKey(dir);
  const before = cache[dir] && cache[dir].key === key ? JSON.stringify(cache[dir].deps) : null;
  try {
    const entry = await fetchDir(dir);
    if (dir !== current || entry.key !== cacheKey(dir) || openRow) return;
    const changed = JSON.stringify(entry.deps) !== before;
    const wait = Math.max(0, animUntil - Date.now());
    if (animateNext || changed || !document.querySelector("#hero:not(.skel):not([hidden]), #out .dep:not(.skel)")) {
      setTimeout(() => { if (dir === current && !openRow) show(entry); }, animateNext ? 0 : wait);
    } else {
      setLive("Live · Stand " + fmt(new Date()) + " Uhr");
    }
  } catch (e) {
    if (dir === current) showError(e);
  }
}

// Die andere Richtung still im Hintergrund vorhalten.
function prefetchOther() {
  if (!current) return;
  const other = current === "in" ? "out" : "in";
  if (!fresh(other, 25000)) fetchDir(other).catch(() => {});
}

function clearRef(el) {
  delete el.dataset.ref;
  el.removeAttribute("role"); el.removeAttribute("tabindex"); el.removeAttribute("aria-expanded");
}
function setRef(el, ref) {
  if (!ref) { clearRef(el); return; }
  el.dataset.ref = ref;
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "0");
  el.setAttribute("aria-expanded", "false");
}
// Wartezeit: Zahlen groß, Einheiten klein. Gibt true zurück, wenn es Stunden sind.
function fillWait(el, mins, unitTag, unitClass) {
  const unit = (u) => { const s = document.createElement(unitTag); if (unitClass) s.className = unitClass; s.textContent = u; return s; };
  if (mins === 0) { el.textContent = "jetzt"; return false; }
  if (mins < 60) { el.append(String(mins), unit("min")); return false; }
  const hh = Math.floor(mins / 60), mm = mins % 60;
  el.append(String(hh), unit("Std"));
  if (mm) el.append(String(mm), unit("min"));
  return true;
}
function chev() {
  const c = document.createElement("span");
  c.className = "chev"; c.setAttribute("aria-hidden", "true"); c.textContent = "⌄";
  return c;
}
function animate(el, i, anim, slideDx) {
  if (!anim) return;
  el.classList.add("fade"); el.style.setProperty("--i", i);
  if (slideDx) { el.classList.add("slide"); el.style.setProperty("--dx", slideDx + "px"); }
}

// Großer „Nächster Bus“-Block.
function buildHero(r, now, anim, slideDx) {
  const h = $("hero");
  h.hidden = false;
  h.className = "hero";
  h.textContent = "";
  h.removeAttribute("style");
  // Der Block bleibt dasselbe Element: einmal neu messen lassen, damit die Einblendung
  // bei jedem Wechsel von vorn startet (wie bei den neu gebauten Listeneinträgen).
  if (anim) void h.offsetWidth;
  animate(h, 0, anim, slideDx);
  const mins = Math.max(0, Math.round((r.real - now) / 60000));
  const delay = Math.round((r.real - r.plan) / 60000);
  const soon = !when && mins <= 5;
  if (soon) h.classList.add("soon");
  setRef(h, r.d.JourneyDetailRef && r.d.JourneyDetailRef.ref);
  paintLine(h, lineOf(r.d));

  const k = document.createElement("div");
  k.className = "k";
  const kl = document.createElement("span");
  kl.textContent = when ? "Erste Abfahrt" : "Nächster Bus";
  k.appendChild(kl);
  if (soon) {
    const em = document.createElement("em");
    em.innerHTML = "<i></i>";
    em.append(mins === 0 ? "Fährt gerade ab" : "Jetzt losgehen");
    k.appendChild(em);
  }

  const row = document.createElement("div");
  row.className = "hrow";
  const big = document.createElement("div");
  big.className = "big";
  if (when) {
    const u = document.createElement("small"); u.textContent = "Uhr";
    big.append(fmt(r.real), u);
  } else if (fillWait(big, mins, "small")) {
    big.classList.add("long");
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  const b = document.createElement("b");
  if (when) {
    b.textContent = dayLabel(r.real);
  } else if (delay > 0) {
    const s = document.createElement("s"); s.textContent = fmt(r.plan);
    const l = document.createElement("span"); l.className = "late"; l.textContent = fmt(r.real) + " Uhr";
    b.append(s, l);
  } else {
    b.textContent = fmt(r.real) + " Uhr";
  }
  meta.append(b, "ab " + stopLabel(routeOf(cfg, current).from));
  row.append(big, meta);

  const dest = document.createElement("div");
  dest.className = "hdest";
  const badge = document.createElement("span");
  badge.className = "badge"; badge.textContent = lineOf(r.d);
  const name = document.createElement("span");
  name.className = "hd"; name.textContent = destName(r.d.direction);
  const st = document.createElement("span");
  if (delay > 0) { st.className = "st late"; st.textContent = "+" + delay + " min"; }
  else if (r.d.rtTime) { st.className = "st"; st.textContent = "pünktlich"; }
  else { st.className = "st plan"; st.textContent = "laut Fahrplan"; }
  dest.append(badge, name, st);
  if (h.dataset.ref) dest.appendChild(chev());

  h.append(k, row, dest);
}

function render(deps) {
  const out = $("out");
  out.innerHTML = "";
  const anim = animateNext;
  animateNext = false;
  if (anim) animUntil = Date.now() + 900;
  const slideDx = anim ? slideFrom : 0;
  slideFrom = 0;
  openRow = null;
  const now = new Date();
  const ref = when || now;
  const rows = deps.map((d) => {
    const plan = parseTime(d.date, d.time);
    const real = parseTime(d.rtDate || d.date, d.rtTime) || plan;
    return { d, plan, real, cancelled: d.cancelled === true || d.cancelled === "true" };
  }).filter((r) => r.real && r.real >= new Date(ref.getTime() - 30000))
    .sort((a, b) => a.real - b.real)
    .slice(0, 9);

  if (!when) setLive("Live · Stand " + fmt(new Date()) + " Uhr");

  if (!rows.length) {
    $("hero").hidden = true;
    $("listHead").hidden = true;
    const m = document.createElement("div");
    m.className = "msg";
    const r = routeOf(cfg, current);
    const way = " von " + stopLabel(r.from) + " nach " + stopLabel(r.to);
    m.textContent = when
      ? "Keine Abfahrten" + way + " in den 12 Stunden ab " + fmt(when) + " Uhr."
      : "Keine Abfahrten" + way + " in den nächsten 12 Stunden.";
    out.appendChild(m);
    return;
  }

  // Der nächste Bus, der nicht ausfällt, steht groß oben; alle anderen in der Liste.
  const hi = rows.findIndex((r) => !r.cancelled);
  if (hi >= 0) buildHero(rows[hi], now, anim, slideDx);
  else $("hero").hidden = true;
  const rest = rows.filter((r, i) => i !== hi);
  $("listHead").hidden = !rest.length;

  rest.forEach((r, i) => {
    const mins = Math.max(0, Math.round((r.real - now) / 60000));
    const delay = Math.round((r.real - r.plan) / 60000);
    const el = document.createElement("div");
    el.className = "dep" + (r.cancelled ? " x" : "");
    animate(el, i + 1, anim, slideDx);
    setRef(el, r.d.JourneyDetailRef && r.d.JourneyDetailRef.ref);
    paintLine(el, lineOf(r.d));

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = lineOf(r.d);

    const dest = document.createElement("div");
    dest.className = "dest";
    const nm = document.createElement("div");
    nm.textContent = destName(r.d.direction);
    const sub = document.createElement("span");
    if (r.cancelled) { sub.textContent = "Fällt aus"; sub.className = "pill"; }
    else if (delay > 0) { sub.textContent = "+" + delay + " min verspätet"; sub.className = "late"; }
    else if (r.d.rtTime) { sub.textContent = "pünktlich"; sub.className = "ok"; }
    else { sub.textContent = "laut Fahrplan"; }
    dest.append(nm, sub);

    const eta = document.createElement("div");
    eta.className = "eta";
    const big = document.createElement("strong");
    const t = document.createElement("span");
    if (when) {
      const u = document.createElement("span"); u.className = "u"; u.textContent = "Uhr";
      big.append(fmt(r.real), u);
      t.textContent = dayLabel(r.real);
    } else {
      fillWait(big, mins, "span", "u");
      if (!r.cancelled && mins <= 5) eta.classList.add("soon");
      if (delay > 0 && !r.cancelled) {
        const s = document.createElement("s"); s.textContent = fmt(r.plan);
        const l = document.createElement("span"); l.className = "late"; l.textContent = fmt(r.real);
        t.append(s, l, " Uhr");
      } else {
        t.textContent = fmt(r.real) + " Uhr";
      }
    }
    eta.append(big, t);

    el.append(badge, dest, eta, el.dataset.ref ? chev() : document.createElement("span"));
    out.appendChild(el);
  });

  // So viele Einträge zeigen, wie ohne Scrollen passen (mindestens 2, höchstens 8).
  let padB = parseFloat(getComputedStyle(document.querySelector("main")).paddingBottom) || 0;
  // Der Home-Balken ist dünn, ein kleiner Abstand reicht, damit möglichst viel Platz genutzt wird.
  padB = Math.min(padB, 10);
  const foot = $("out");   // Unterkante der Liste
  // Am Computer steckt alles in einer mittigen Karte: dann zählt deren Unterkante samt Rand.
  const card = getComputedStyle(document.body).display === "flex";
  const mainEl = document.querySelector("main");
  const bottom = () => card
    ? mainEl.getBoundingClientRect().bottom + window.scrollY + 24
    : foot.getBoundingClientRect().bottom + window.scrollY + padB;
  if (card) {
    // Am Computer mit dem Fenster mitwachsen (bis 15 % größer), aber nur so weit,
    // dass mindestens 5 weitere Einträge sichtbar bleiben.
    const want = Math.min(1.15, Math.max(1, Math.min(window.innerWidth / 1600, window.innerHeight / 840)));
    const keep = Math.min(5, out.children.length);
    const extra = [...out.children].slice(keep);
    extra.forEach((e) => e.remove());
    let z = want;
    mainEl.style.zoom = z;
    while (z > 1 && bottom() > window.innerHeight) { z = Math.max(1, z - 0.05); mainEl.style.zoom = z; }
    extra.forEach((e) => out.appendChild(e));
  } else {
    mainEl.style.zoom = "";
  }
  while (out.children.length > 2 && bottom() > window.innerHeight) {
    out.removeChild(out.lastElementChild);
  }
}

// ---- Bedienung -----------------------------------------------------------
function select(dir) {
  current = dir;
  animateNext = true;
  store.set("dir", dir);
  $("btnIn").setAttribute("aria-pressed", String(dir === "in"));
  $("btnOut").setAttribute("aria-pressed", String(dir === "out"));
  applyRoute();
  const c = fresh(dir, 5 * 60000);
  if (c) {
    show(c);                                 // sofort aus dem Vorrat, ohne Ladehinweis
    if (Date.now() - c.at > 20000) load();   // und still auffrischen
  } else {
    showSkeleton();
    load();
  }
  prefetchOther();
  clearInterval(timer);
  // Solange ein Verlauf aufgeklappt ist, bleibt die Liste stehen.
  timer = setInterval(() => { if (!when && !openRow) { load(); prefetchOther(); } }, 30000);
}

// Wischen nach links: „Aus der Stadt“, nach rechts: „In die Stadt“.
// Bewegungen, die am Bildschirmrand starten, bleiben dem Browser (Zurück/Vor) überlassen.
let swipe = null;
document.addEventListener("touchstart", (e) => {
  swipe = null;
  if (e.touches.length !== 1 || !$("sheet").hidden || !$("picker").hidden || !$("settings").hidden) return;
  if (e.target.closest("input, #setup")) return;
  const t = e.touches[0];
  if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
  swipe = { x: t.clientX, y: t.clientY, at: Date.now() };
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!swipe) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  const quick = Date.now() - swipe.at < 800;
  swipe = null;
  if (!quick || Math.abs(dx) < 60 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
  const dir = dx < 0 ? "out" : "in";
  if (dir === current) return;
  slideFrom = dx < 0 ? 40 : -40;
  select(dir);
}, { passive: true });
document.addEventListener("touchcancel", () => { swipe = null; }, { passive: true });

// Antippen von „Live · Stand …“ aktualisiert sofort.
$("live").addEventListener("click", async () => {
  if (!current || $("live").classList.contains("busy")) return;
  if (openRow) closeRow(openRow);
  $("live").classList.add("busy");
  const t0 = Date.now();
  await load();
  prefetchOther();
  // Das Symbol kurz sichtbar drehen lassen, auch wenn die Antwort sehr schnell kommt.
  setTimeout(() => $("live").classList.remove("busy"), Math.max(0, 600 - (Date.now() - t0)));
});

$("btnIn").addEventListener("click", () => select("in"));
$("btnOut").addEventListener("click", () => select("out"));
// Einstellungen als eigenes Fenster. „Abbrechen“ verwirft, „Speichern“ übernimmt.
function openSetup() {
  draft = clone(cfg);
  buildSetup();
  $("worker").value = store.get("worker") || "";
  $("settings").hidden = false;
  $("settings").scrollTop = 0;
  document.documentElement.style.overflow = "hidden";
}
function closeSetup(after) {
  $("settings").hidden = true;
  document.documentElement.style.overflow = "";
  draft = null;
  if (after) after();
}
$("gear").addEventListener("click", openSetup);
$("setupCancel").addEventListener("click", () => closeSetup());
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("settings").hidden && $("picker").hidden) closeSetup();
});

function updateWhenUI() {
  $("when").classList.toggle("on", !!when);
  $("whenChip").hidden = !when;
  $("live").hidden = !!when;
  $("whenText").textContent = when ? dayLabel(when) + " ab " + fmt(when) + " Uhr" : "";
}
function setWhen(d) {
  when = d;
  updateWhenUI();
  if (current) select(current);
}
function openSheet() {
  const base = when || new Date();
  $("wDate").min = ymd(new Date());
  $("wDate").value = ymd(base);
  $("wTime").value = hm(base);
  $("wErr").textContent = "";
  $("sheet").hidden = false;
}
function closeSheet() { $("sheet").hidden = true; }

$("when").addEventListener("click", openSheet);
// Ein Tipp irgendwo im Eintrag oder im großen Block, auch auf den Verlauf selbst, klappt auf oder zu.
["out", "hero"].forEach((id) => {
  $(id).addEventListener("click", (e) => {
    const row = e.target.closest(".dep[data-ref], #hero[data-ref]");
    if (row) toggleRow(row);
  });
  $(id).addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest && e.target.closest(".dep[data-ref], #hero[data-ref]");
    if (row && e.target === row) { e.preventDefault(); toggleRow(row); }
  });
});
$("wApply").addEventListener("click", () => {
  const d = $("wDate").value, t = $("wTime").value;
  if (!d || !t) { $("wErr").textContent = "Bitte Tag und Uhrzeit wählen."; return; }
  const sel = new Date(d + "T" + t);
  if (isNaN(sel.getTime())) { $("wErr").textContent = "Diese Zeit ist ungültig."; return; }
  if (sel.getTime() < Date.now() - 5 * 60000) {
    $("wErr").textContent = "Die gewählte Zeit liegt in der Vergangenheit."; return;
  }
  closeSheet();
  setWhen(sel.getTime() - Date.now() < 120000 ? null : sel);
});
$("wNow").addEventListener("click", () => { closeSheet(); setWhen(null); });
$("whenClear").addEventListener("click", () => setWhen(null));
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("saveKey").addEventListener("click", () => {
  const w = $("worker").value.trim();
  if (!w) { $("worker").focus(); return; }
  store.set("worker", w);
  if (draft) {
    document.querySelectorAll("#setup input.gname").forEach((inp) => {
      draft[inp.dataset.dir].name = inp.value.trim() || DEFAULT_CFG[inp.dataset.dir].name;
    });
    cfg = draft; draft = null;
    saveCfg(); applyTiles();
    cache = {};
  }
  closeSetup(() => { if (current) select(current); });  // lädt mit den neuen Einstellungen
});

// ---- Einstellungen: Haltestellen und Linien ---------------------------------
let draft = null;
function buildSetup() {
  $("mirror").checked = !!draft.mirror;
  document.querySelectorAll("#setup .group").forEach((g) => {
    const dir = g.dataset.dir;
    const r = routeOf(draft, dir);
    const locked = dir === "out" && draft.mirror;
    g.textContent = "";
    const head = document.createElement("div");
    head.className = "ghead";
    const name = document.createElement("input");
    name.className = "gname"; name.dataset.dir = dir; name.maxLength = 24;
    name.value = draft[dir].name; name.setAttribute("aria-label", "Name der Kachel");
    name.addEventListener("input", () => { draft[dir].name = name.value; });
    const ed = document.createElement("span");
    ed.className = "gedit"; ed.textContent = "Name ändern";
    ed.addEventListener("click", () => name.focus());
    head.append(name, ed);
    g.appendChild(head);
    [["from", "Von", true], ["to", "Nach", false]].forEach(([end, lbl, first]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "field"; b.disabled = locked;
      b.innerHTML = '<span class="dot' + (first ? " f" : "") + '"></span><span class="lbl"></span><span class="val"></span>' +
        (locked ? "" : '<span class="arrow">›</span>');
      b.querySelector(".lbl").textContent = lbl;
      b.querySelector(".val").textContent = stopLabel(r[end]);
      b.addEventListener("click", () => openPicker(dir, end));
      g.appendChild(b);
    });
    const lines = document.createElement("div");
    lines.className = "lines";
    const l = document.createElement("span");
    l.className = "lbl"; l.textContent = "Linien";
    lines.appendChild(l);
    const seen = r.from.id && r.to.id ? seenLines(r.from.id, r.to.id) : [];
    const off = draft[dir].off || (draft[dir].off = []);
    const all = [...new Set([...seen, ...off])].sort(byLine);
    if (!all.length) {
      const n = document.createElement("span");
      n.textContent = "alle – erscheinen nach der ersten Abfrage";
      lines.appendChild(n);
    }
    all.forEach((ln) => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "lchip"; c.textContent = ln;
      paintLine(c, ln);
      c.setAttribute("aria-pressed", String(!off.includes(ln)));
      c.setAttribute("aria-label", "Linie " + ln + " anzeigen");
      c.addEventListener("click", () => {
        const i = off.indexOf(ln);
        if (i >= 0) off.splice(i, 1); else off.push(ln);
        c.setAttribute("aria-pressed", String(i >= 0));
      });
      lines.appendChild(c);
    });
    g.appendChild(lines);
  });
}
$("mirror").addEventListener("change", () => {
  if (!draft) return;
  // Namen aus den Feldern nicht verlieren.
  document.querySelectorAll("#setup input.gname").forEach((inp) => { draft[inp.dataset.dir].name = inp.value; });
  draft.mirror = $("mirror").checked;
  draft.out.off = [];
  buildSetup();
});

// ---- Haltestellensuche (eigene Seite) --------------------------------------
let pick = null, pickTimer = null, pickSeq = 0, pickScroll = 0;
function recentStops() {
  try { return JSON.parse(store.get("recent_stops") || "[]"); } catch (e) { return []; }
}
function rememberStop(s) {
  const list = recentStops().filter((x) => x.id !== s.id);
  list.unshift({ id: s.id, name: s.name });
  store.set("recent_stops", JSON.stringify(list.slice(0, 5)));
}
function stopButton(s, query) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pkopt";
  const n = s.name || "";
  const i = query ? norm(n).indexOf(norm(query)) : -1;
  if (i >= 0) {
    // norm() ändert nur ß → ss, daher Länge über den Originaltext suchen.
    let len = query.length;
    while (len < n.length && norm(n.slice(i, i + len)).length < norm(query).length) len++;
    b.append(n.slice(0, i));
    const m = document.createElement("b"); m.textContent = n.slice(i, i + len);
    b.append(m, n.slice(i + len));
  } else {
    b.textContent = n;
  }
  b.addEventListener("click", () => choose(s));
  return b;
}
function showRecent() {
  const list = recentStops();
  $("pkRecent").textContent = "";
  list.forEach((s) => $("pkRecent").appendChild(stopButton(s, "")));
  $("pkRecentHead").hidden = !list.length;
}
function openPicker(dir, end) {
  pick = { dir, end };
  pickScroll = window.scrollY;
  $("pkTitle").textContent = end === "from" ? "Starthaltestelle" : "Zielhaltestelle";
  $("pkInput").value = "";
  $("pkList").textContent = "";
  showRecent();
  $("picker").hidden = false;
  $("picker").scrollTop = 0;
  $("pkInput").focus();
}
function closePicker() {
  $("picker").hidden = true;
  pick = null;
  clearTimeout(pickTimer);
  window.scrollTo(0, pickScroll);
}
function choose(s) {
  if (!pick || !draft) return;
  const { dir, end } = pick;
  draft[dir][end] = { id: s.id, name: s.name, label: shortName(s.name) };
  draft[dir].off = [];                       // andere Strecke, andere Linien
  if (dir === "in" && draft.mirror) draft.out.off = [];
  rememberStop(s);
  document.querySelectorAll("#setup input.gname").forEach((inp) => { draft[inp.dataset.dir].name = inp.value; });
  closePicker();
  buildSetup();
}
$("pkBack").addEventListener("click", closePicker);
$("pkInput").addEventListener("input", () => {
  clearTimeout(pickTimer);
  const q = $("pkInput").value.trim();
  const box = $("pkList");
  if (q.length < 2) { box.textContent = ""; showRecent(); return; }
  $("pkRecentHead").hidden = true; $("pkRecent").textContent = "";
  pickTimer = setTimeout(async () => {
    const seq = ++pickSeq;
    try {
      const list = await searchStops(q);
      if (seq !== pickSeq) return;          // inzwischen weitergetippt
      box.textContent = "";
      if (!list.length) {
        const n = document.createElement("div"); n.className = "pknote"; n.textContent = "Keine Haltestelle gefunden.";
        box.appendChild(n); return;
      }
      list.forEach((s) => box.appendChild(stopButton(s, q)));
    } catch (e) {
      if (seq !== pickSeq) return;
      box.textContent = "";
      const n = document.createElement("div"); n.className = "pknote"; n.textContent = e.message || String(e);
      box.appendChild(n);
    }
  }, 250);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("picker").hidden) closePicker(); });

// Nach dem Drehen oder einer Größenänderung neu einpassen.
// Kleine Höhenänderungen (Browserleiste ein-/ausgeblendet) lösen nichts aus.
let fitTimer = null, fitW = window.innerWidth, fitH = window.innerHeight;
// Auf welcher Seite liegt im Querformat die Kamera-Aussparung?
// 90 = Handy nach links gedreht (Aussparung links), -90/270 = nach rechts.
function markNotch() {
  let a = typeof window.orientation === "number" ? window.orientation
        : (screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : 0);
  if (a === 270) a = -90;
  const root = document.documentElement;
  root.classList.toggle("notch-left", a === 90);
  root.classList.toggle("notch-right", a === -90);
}
markNotch();
function refit(force) {
  markNotch();
  const w = window.innerWidth, hh = window.innerHeight;
  if (!force && w === fitW && Math.abs(hh - fitH) < 120) return;
  fitW = w; fitH = hh;
  // iOS passt die Kacheln nach dem Drehen nicht immer an: neu aufbauen erzwingt das Layout.
  const btns = document.querySelector(".buttons");
  btns.style.display = "none";
  void btns.offsetHeight;
  btns.style.display = "";
  applyTiles();
  if (lastDeps && current && !openRow && $("picker").hidden) render(lastDeps);
}
window.addEventListener("resize", () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => refit(false), 200);
});
// Manche iPhones melden die neue Größe erst kurz nach dem Drehen.
window.addEventListener("orientationchange", () => {
  setTimeout(() => refit(true), 350);
  setTimeout(() => refit(true), 800);
});
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener("change", () => setTimeout(() => refit(true), 350));
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  // Nach längerer Pause zurück auf „Jetzt“, damit nichts Veraltetes stehen bleibt.
  if (when && Date.now() - hiddenAt > 300000) setWhen(null);
  else if (current && !when) { load(); prefetchOther(); }
});

applyTiles();
$("worker").value = store.get("worker") || "";
if (!store.get("worker")) openSetup();
select(current || "in");
</script>
</body>
</html>
