<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus">
<meta name="theme-color" content="#0f1720">
<title>Bus Naurod</title>
<style>
  :root {
    --bg: #f3f5f7; --fg: #101820; --muted: #5b6875; --card: #ffffff;
    --line: #dde3e8; --accent: #0b6b4f; --accent-fg: #ffffff;
    --late: #b3261e; --ok: #0b6b4f; --soon: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1720; --fg: #eef2f5; --muted: #93a1ae; --card: #17212c;
      --line: #263341; --accent: #3ec99a; --accent-fg: #07251b;
      --late: #ff8a80; --ok: #3ec99a; --soon: #ffb454; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 8px 0 16px; }
  .buttons { display: grid; gap: 12px; }
  button.dir { font: inherit; font-size: 22px; font-weight: 700; padding: 22px 16px;
    border-radius: 14px; border: 2px solid var(--accent); background: transparent;
    color: var(--accent); text-align: left; }
  button.dir small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  button.dir[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  button.dir[aria-pressed="true"] small { color: inherit; opacity: .8; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #out { margin-top: 20px; display: grid; gap: 10px; }
  .dep { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .dep:first-child { border-color: var(--accent); }
  .badge { min-width: 48px; text-align: center; font-weight: 700; padding: 6px 8px;
    border-radius: 8px; background: var(--accent); color: var(--accent-fg); }
  .dest { min-width: 0; overflow-wrap: anywhere; }
  .dest span { display: block; color: var(--muted); font-size: 14px; }
  .late { color: var(--late); }
  .eta { text-align: right; font-variant-numeric: tabular-nums; }
  .eta strong { font-size: 26px; display: block; line-height: 1.1; }
  .eta span { font-size: 14px; color: var(--muted); }
  .eta.soon strong { color: var(--soon); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .eta.soon strong { animation: none; } }
  .msg { color: var(--muted); padding: 12px 2px; overflow-wrap: anywhere; }
  .msg.err { color: var(--late); }
  .foot { margin-top: 18px; font-size: 13px; color: var(--muted); display: flex;
    justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .foot button { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted);
    text-decoration: underline; padding: 4px 0; }
  #setup { margin-top: 20px; display: none; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; }
  #setup.open { display: block; }
  #setup label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  #setup input { width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #setup .row { display: flex; gap: 8px; margin-top: 10px; }
  #setup .row button { font: inherit; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  #setup .row button.sec { background: transparent; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Bus Naurod ⇄ Wiesbaden</h1>

  <div class="buttons">
    <button class="dir" id="btnIn" aria-pressed="false">In die Stadt
      <small>Fondetter Straße → Dernsches Gelände</small></button>
    <button class="dir" id="btnOut" aria-pressed="false">Aus der Stadt
      <small>Wilhelmstraße → Fondetter Straße</small></button>
  </div>

  <div id="out" aria-live="polite"></div>

  <div class="foot">
    <span id="stamp"></span>
    <button id="openSetup">Einstellungen</button>
  </div>

  <section id="setup">
    <label for="worker">Worker-Adresse (https://….workers.dev)</label>
    <input id="worker" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="msg" id="stopinfo"></div>
    <div class="row">
      <button id="saveKey">Speichern</button>
      <button id="resetIds" class="sec">Haltestellen neu suchen</button>
    </div>
  </section>
</main>

<script>
"use strict";
// ---- Konfiguration -------------------------------------------------------
// Adresse deines Cloudflare Workers; wird in den Einstellungen gespeichert.
const LINES = ["20", "21", "22", "N20"];
const STOPS = {
  naurod: { query: "Naurod Fondetter Straße", mustContain: "fondetter", id: "3025442", name: "WI-Naurod Fondetter Straße" },
  stadt:  { query: "Wiesbaden Wilhelmstraße",  mustContain: "wilhelmstra" },
  ziel:   { query: "Wiesbaden Dernsches Gelände", mustContain: "dern" }
};
const ROUTES = {
  in:  { from: "naurod", to: "ziel" },
  out: { from: "stadt",  to: "naurod" }
};

// ---- Speicher (kann in privaten Fenstern fehlen) --------------------------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const $ = (id) => document.getElementById(id);
let current = store.get("dir") || null;
let timer = null;

// ---- Hilfsfunktionen -----------------------------------------------------
function norm(s) {
  return (s || "").toLowerCase().replace(/ß/g, "ss").replace(/straße/g, "strasse");
}

async function hapi(path, params) {
  let base = (store.get("worker") || "").trim().replace(/\/+$/, "");
  if (!base) throw new Error("Noch keine Worker-Adresse gespeichert. Unter „Einstellungen“ eintragen.");
  const qs = new URLSearchParams(params);
  let res;
  try {
    // Der RMV-Schlüssel liegt als Secret im Worker, nicht in der App.
    res = await fetch(base + "/" + path + "?" + qs.toString());
  } catch (e) {
    throw new Error("Keine Verbindung zum Worker. Adresse und Internet prüfen.");
  }
  if (!res.ok) throw new Error("Worker/RMV antwortet mit Fehler " + res.status + ".");
  const data = await res.json();
  if (data.errorCode) throw new Error("RMV: " + (data.errorText || data.errorCode));
  return data;
}

async function stopId(name) {
  const cfg = STOPS[name];
  if (cfg.id) return cfg.id;
  const cached = store.get("stop_" + name);
  if (cached) return cached;
  const data = await hapi("location.name", { input: cfg.query });
  const list = (data.stopLocationOrCoordLocation || [])
    .map((x) => x.StopLocation).filter(Boolean);
  const hit = list.find((s) => norm(s.name).includes(cfg.mustContain)) || list[0];
  if (!hit) throw new Error("Haltestelle „" + cfg.query + "“ nicht gefunden.");
  const id = hit.extId || hit.id;
  store.set("stop_" + name, id);
  store.set("stopname_" + name, hit.name);
  return id;
}

function parseTime(date, time) {
  if (!date || !time) return null;
  return new Date(date + "T" + time);
}

function lineOf(d) {
  const p = d.ProductAtStop || {};
  return (p.line || (d.name || "").replace(/^Bus\s*/i, "")).trim();
}

function fmt(d) {
  return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

// ---- Abfrage -------------------------------------------------------------
async function load() {
  const out = $("out");
  if (!current) { out.innerHTML = ""; return; }
  const route = ROUTES[current];
  try {
    const fromId = await stopId(route.from);
    const toId = await stopId(route.to);
    let data = await hapi("departureBoard", {
      id: fromId, direction: toId, lines: LINES.join(","), maxJourneys: 12, duration: 120
    });
    let deps = data.Departure || [];
    deps = deps.filter((d) => LINES.includes(lineOf(d)));
    render(deps);
  } catch (e) {
    out.innerHTML = "";
    const m = document.createElement("div");
    m.className = "msg err";
    m.textContent = e.message || String(e);
    out.appendChild(m);
  }
}

function render(deps) {
  const out = $("out");
  out.innerHTML = "";
  const now = new Date();
  const rows = deps.map((d) => {
    const plan = parseTime(d.date, d.time);
    const real = parseTime(d.rtDate || d.date, d.rtTime) || plan;
    return { d, plan, real, cancelled: d.cancelled === true || d.cancelled === "true" };
  }).filter((r) => r.real && r.real >= new Date(now.getTime() - 30000))
    .sort((a, b) => a.real - b.real)
    .slice(0, 4);

  if (!rows.length) {
    const m = document.createElement("div");
    m.className = "msg";
    m.textContent = "Keine Abfahrten der Linien 20, 21, 22 oder N20 in den nächsten 2 Stunden.";
    out.appendChild(m);
  }

  rows.forEach((r) => {
    const mins = Math.max(0, Math.round((r.real - now) / 60000));
    const delay = Math.round((r.real - r.plan) / 60000);
    const el = document.createElement("div");
    el.className = "dep";

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = lineOf(r.d);

    const dest = document.createElement("div");
    dest.className = "dest";
    dest.textContent = r.d.direction || "";
    const sub = document.createElement("span");
    if (r.cancelled) { sub.textContent = "Fällt aus"; sub.className = "late"; }
    else if (delay > 0) { sub.textContent = "+" + delay + " min Verspätung (Plan " + fmt(r.plan) + ")"; sub.className = "late"; }
    else { sub.textContent = r.d.rtTime ? "pünktlich" : "laut Fahrplan"; }
    dest.appendChild(sub);

    const eta = document.createElement("div");
    eta.className = "eta";
    const big = document.createElement("strong");
    big.textContent = mins === 0 ? "jetzt" : mins + " min";
    if (!r.cancelled && mins <= 5) eta.classList.add("soon");
    const t = document.createElement("span");
    t.textContent = fmt(r.real);
    eta.append(big, t);

    el.append(badge, dest, eta);
    out.appendChild(el);
  });

  $("stamp").textContent = "Stand " + fmt(new Date());
  $("stopinfo").textContent = "Haltestellen: " + STOPS.naurod.name + " / " +
    (store.get("stopname_stadt") || "–") + " / " + (store.get("stopname_ziel") || "–");
}

// ---- Bedienung -----------------------------------------------------------
function select(dir) {
  current = dir;
  store.set("dir", dir);
  $("btnIn").setAttribute("aria-pressed", String(dir === "in"));
  $("btnOut").setAttribute("aria-pressed", String(dir === "out"));
  $("out").innerHTML = '<div class="msg">Lade Abfahrten …</div>';
  load();
  clearInterval(timer);
  timer = setInterval(load, 30000);
}

$("btnIn").addEventListener("click", () => select("in"));
$("btnOut").addEventListener("click", () => select("out"));
$("openSetup").addEventListener("click", () => $("setup").classList.toggle("open"));
$("saveKey").addEventListener("click", () => {
  const w = $("worker").value.trim();
  if (w) { store.set("worker", w); $("setup").classList.remove("open"); if (current) select(current); }
});
$("resetIds").addEventListener("click", () => {
  ["stop_naurod", "stop_stadt", "stop_ziel", "stopname_naurod", "stopname_stadt", "stopname_ziel"].forEach(store.del);
  if (current) select(current);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && current) load(); });

$("worker").value = store.get("worker") || "";
if (!store.get("worker")) $("setup").classList.add("open");
if (current) select(current);
</script>
</body>
</html>
